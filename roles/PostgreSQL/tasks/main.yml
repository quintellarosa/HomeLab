---
- name: Validate PostgreSQL platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat", "Suse"]
    fail_msg: "PostgreSQL installation supports Debian, RedHat, and SUSE systems."

- name: Verify the host has a default IPv4 network
  ansible.builtin.assert:
    that:
      - ansible_facts.get('default_ipv4', {}).get('network', '') | length > 0
      - ansible_facts.get('default_ipv4', {}).get('prefix', '') | string | length > 0
      - postgresql.port | int >= 1
      - postgresql.port | int <= 65535
    fail_msg: "PostgreSQL requires a default IPv4 network and a valid TCP port."

- name: Set the PostgreSQL client network
  ansible.builtin.set_fact:
    postgresql_host_network: "{{ ansible_facts['default_ipv4']['network'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"
    postgresql_allowed_networks: >-
      {{
        (
          [ansible_facts['default_ipv4']['network'] ~ '/' ~ ansible_facts['default_ipv4']['prefix']]
          + (postgresql.client_networks | default([]))
        )
        | unique
        | list
      }}

- name: Configure PostgreSQL for Debian-family systems
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Configure PostgreSQL for RedHat-family systems
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Configure PostgreSQL for SUSE-family systems
  ansible.builtin.include_tasks: SUSE.yml
  when: ansible_facts['os_family'] == "Suse"

- name: Listen on all network interfaces
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^\\s*#?\\s*listen_addresses\\s*="
    line: "listen_addresses = '*'"
  loop: "{{ postgresql_config_files }}"
  notify: Restart PostgreSQL

- name: Set PostgreSQL port
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^\\s*#?\\s*port\\s*="
    line: "port = {{ postgresql.port }}"
  loop: "{{ postgresql_config_files }}"
  notify: Restart PostgreSQL

- name: Allow password-authenticated clients from configured networks
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "^host\\s+all\\s+all\\s+{{ item.1 | regex_escape }}\\s+"
    line: "host all all {{ item.1 }} scram-sha-256"
    insertbefore: '^host'
  loop: "{{ postgresql_hba_files | product(postgresql_allowed_networks) | list }}"
  notify: Restart PostgreSQL

- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

