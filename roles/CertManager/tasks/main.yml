---
- name: Ensure OS family is supported by CertManager role
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}' for CertManager role (supported: Debian, RedHat, Suse)."

# ---------------------------------------------------------------------------
# 1. Verify that this host is running a Kubernetes Master (control plane)
# ---------------------------------------------------------------------------
- name: Check Kubernetes master files on target host
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ cert_manager_kubeconfig }}"
    - "{{ cert_manager_apiserver_manifest }}"
  register: _cert_manager_master_files

- name: Check if Kubernetes Master is running on this host
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ cert_manager_kubeconfig }}
      get nodes -l node-role.kubernetes.io/control-plane
      --no-headers
  register: _cert_manager_master_running_cmd
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _cert_manager_master_files.results[0].stat.exists
    - _cert_manager_master_files.results[1].stat.exists

- name: Record whether target host has a running Kubernetes Master
  ansible.builtin.set_fact:
    _cert_manager_has_running_master: >-
      {{
        (_cert_manager_master_files.results[0].stat.exists | default(false))
        and (_cert_manager_master_files.results[1].stat.exists | default(false))
        and (_cert_manager_master_running_cmd.rc | default(1) == 0)
        and ((_cert_manager_master_running_cmd.stdout | default('') | trim | length) > 0)
      }}

- name: Skip CertManager role when target host does not have a running Kubernetes Master
  ansible.builtin.debug:
    msg: >-
      Skipping CertManager role: no running Kubernetes Master (control plane) was detected on this host.
  when: not (_cert_manager_has_running_master | bool)

# ---------------------------------------------------------------------------
# 2. Install cert-manager, bootstrap Private HomeLab CA, and trust it locally
# ---------------------------------------------------------------------------
- name: Install and configure cert-manager with Private HomeLab CA
  when: _cert_manager_has_running_master | bool
  block:
    - name: Download cert-manager {{ cert_manager_version }} manifest
      ansible.builtin.get_url:
        url: "{{ cert_manager_manifest_url }}"
        dest: "{{ cert_manager_manifest_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Render HomeLab Private CA and ClusterIssuer manifest
      ansible.builtin.template:
        src: homelab-ca.yaml.j2
        dest: "{{ cert_manager_ca_config_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Apply cert-manager {{ cert_manager_version }} manifest
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          apply -f {{ cert_manager_manifest_file }}
      when: not ansible_check_mode
      register: _cert_manager_manifest_apply
      changed_when: >-
        ('created' in _cert_manager_manifest_apply.stdout)
        or ('configured' in _cert_manager_manifest_apply.stdout)

    - name: Wait for cert-manager deployments to become available
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          -n {{ cert_manager_namespace }}
          rollout status deployment/{{ item }} --timeout=180s
      loop:
        - cert-manager
        - cert-manager-cainjector
        - cert-manager-webhook
      when: not ansible_check_mode
      changed_when: false

    - name: Wait for cert-manager webhook EndpointSlice to be ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          -n {{ cert_manager_namespace }} get endpointslices
          -l kubernetes.io/service-name=cert-manager-webhook
          -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}'
      register: _cert_manager_webhook_ep
      retries: 24
      delay: 5
      until: (_cert_manager_webhook_ep.stdout | trim | length) > 0
      when: not ansible_check_mode
      changed_when: false

    - name: Apply HomeLab Root CA Certificate and ClusterIssuer
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          apply -f {{ cert_manager_ca_config_file }}
      when: not ansible_check_mode
      register: _cert_manager_ca_apply
      changed_when: >-
        ('created' in _cert_manager_ca_apply.stdout)
        or ('configured' in _cert_manager_ca_apply.stdout)

    - name: Wait for HomeLab Root CA Certificate to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          -n {{ cert_manager_namespace }}
          wait --for=condition=Ready certificate/{{ cert_manager_ca_cert_name }} --timeout=120s
      when: not ansible_check_mode
      changed_when: false

    - name: Wait for HomeLab ClusterIssuer to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          wait --for=condition=Ready clusterissuer/{{ cert_manager_ca_issuer_name }} --timeout=120s
      when: not ansible_check_mode
      changed_when: false

    - name: Read HomeLab Root CA certificate from Kubernetes Secret
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          -n {{ cert_manager_namespace }}
          get secret {{ cert_manager_ca_secret_name }}
          -o jsonpath='{.data.ca\.crt}'
      register: _cert_manager_ca_b64
      changed_when: false
      when: not ansible_check_mode

    - name: Decode HomeLab Root CA PEM certificate
      ansible.builtin.set_fact:
        _cert_manager_ca_pem: "{{ _cert_manager_ca_b64.stdout | b64decode }}"
      when:
        - not ansible_check_mode
        - (_cert_manager_ca_b64.stdout | default('') | trim | length) > 0

    - name: Export HomeLab Root CA certificate to {{ cert_manager_ca_cert_file }}
      ansible.builtin.copy:
        content: "{{ _cert_manager_ca_pem }}"
        dest: "{{ cert_manager_ca_cert_file }}"
        owner: root
        group: root
        mode: "0644"
      when:
        - not ansible_check_mode
        - _cert_manager_ca_pem is defined

    # Publish Root CA ConfigMap inside the cluster for pod-to-pod HTTPS trust
    - name: Publish HomeLab Root CA ConfigMap inside the cluster
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ cert_manager_kubeconfig }}
          -n {{ cert_manager_cluster_configmap_namespace }}
          create configmap {{ cert_manager_cluster_configmap_name }}
          --from-file=ca.crt={{ cert_manager_ca_cert_file }}
          --dry-run=client -o yaml
          | kubectl --kubeconfig {{ cert_manager_kubeconfig }} apply -f -
      register: _cert_manager_ca_cm_apply
      changed_when: >-
        ('created' in _cert_manager_ca_cm_apply.stdout)
        or ('configured' in _cert_manager_ca_cm_apply.stdout)
      when:
        - cert_manager_publish_cluster_configmap | bool
        - not ansible_check_mode
        - _cert_manager_ca_pem is defined

    # Install HomeLab Root CA into the host OS trust store (Debian, RedHat, SUSE)
    - name: Install HomeLab Root CA into host OS trust store
      ansible.builtin.copy:
        src: "{{ cert_manager_ca_cert_file }}"
        dest: "{{ cert_manager_os_ca_dest_by_family[ansible_facts['os_family']] }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - cert_manager_trust_os_ca | bool
        - not ansible_check_mode
        - _cert_manager_ca_pem is defined
      notify: Update OS CA trust store

    # Install HomeLab Root CA into Google Chrome's NSS trust database (~/.pki/nssdb)
    - name: Configure Google Chrome NSS trust database for HomeLab Root CA
      when:
        - cert_manager_trust_chrome_nss | bool
        - cert_manager_user | default('') | length > 0
        - not ansible_check_mode
        - _cert_manager_ca_pem is defined
      block:
        - name: Install NSS tools (certutil) for Chrome certificate trust
          ansible.builtin.package:
            name: "{{ cert_manager_nss_package_by_family[ansible_facts['os_family']] }}"
            state: present

        - name: Look up target user passwd entry for Chrome NSS database
          ansible.builtin.getent:
            database: passwd
            key: "{{ cert_manager_user }}"

        - name: Set target user NSS database path and primary group
          ansible.builtin.set_fact:
            _cert_manager_user_home: "{{ ansible_facts.getent_passwd[cert_manager_user][4] }}"
            _cert_manager_user_gid: "{{ ansible_facts.getent_passwd[cert_manager_user][2] }}"
            _cert_manager_nssdb_dir: "{{ ansible_facts.getent_passwd[cert_manager_user][4] }}/.pki/nssdb"

        - name: Ensure user ~/.pki/nssdb directory exists
          ansible.builtin.file:
            path: "{{ _cert_manager_nssdb_dir }}"
            state: directory
            owner: "{{ cert_manager_user }}"
            group: "{{ _cert_manager_user_gid }}"
            mode: "0700"

        - name: Check if Chrome NSS cert9.db is initialized
          ansible.builtin.stat:
            path: "{{ _cert_manager_nssdb_dir }}/cert9.db"
          register: _cert_manager_nssdb_stat

        - name: Initialize Chrome NSS database if missing
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ cert_manager_user }}"
              - --
              - certutil
              - -d
              - "sql:{{ _cert_manager_nssdb_dir }}"
              - -N
              - --empty-password
          when: not _cert_manager_nssdb_stat.stat.exists
          changed_when: true

        - name: Check if HomeLab Root CA is already installed in Chrome NSS database
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ cert_manager_user }}"
              - --
              - certutil
              - -d
              - "sql:{{ _cert_manager_nssdb_dir }}"
              - -L
              - -n
              - "{{ cert_manager_ca_common_name }}"
              - -a
          register: _cert_manager_nss_existing
          changed_when: false
          failed_when: false

        - name: Remove outdated HomeLab Root CA entry from Chrome NSS database
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ cert_manager_user }}"
              - --
              - certutil
              - -d
              - "sql:{{ _cert_manager_nssdb_dir }}"
              - -D
              - -n
              - "{{ cert_manager_ca_common_name }}"
          when:
            - _cert_manager_nss_existing.rc == 0
            - (_cert_manager_nss_existing.stdout | trim) != (_cert_manager_ca_pem | trim)
          changed_when: true

        - name: Add HomeLab Root CA to Google Chrome NSS database
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ cert_manager_user }}"
              - --
              - certutil
              - -d
              - "sql:{{ _cert_manager_nssdb_dir }}"
              - -A
              - -t
              - "C,,"
              - -n
              - "{{ cert_manager_ca_common_name }}"
              - -i
              - "{{ cert_manager_ca_cert_file }}"
          when: >-
            (_cert_manager_nss_existing.rc != 0)
            or ((_cert_manager_nss_existing.stdout | trim) != (_cert_manager_ca_pem | trim))
          changed_when: true

    - name: Report CertManager setup summary
      ansible.builtin.debug:
        msg: >-
          cert-manager {{ cert_manager_version }} is active with Private HomeLab CA ClusterIssuer '{{ cert_manager_ca_issuer_name }}'
          ({{ cert_manager_ca_common_name }}). Annotate Ingresses for *.{{ cert_manager_domain }} with
          'cert-manager.io/cluster-issuer: {{ cert_manager_ca_issuer_name }}'.
          Root CA exported to {{ cert_manager_ca_cert_file }} and trusted in the OS and Google Chrome NSS stores.
      when: (_cert_manager_manifest_apply is changed) or (_cert_manager_ca_apply is changed)
