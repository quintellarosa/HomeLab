---
apt_architectures:
  x86_64: amd64
  aarch64: arm64

docker_engine_packages:
  Debian:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  RedHat:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  Suse:
    - docker
    - containerd
    - docker-compose

target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"