---
# Ensure prerequisite tools (curl, zstd, and ubuntu-drivers-common for GPU detection)
# are installed before configuring drivers and fetching Ollama.
- name: Install prerequisite packages for NVIDIA drivers and Ollama
  ansible.builtin.apt:
    name:
      - curl
      - zstd
      - ubuntu-drivers-common
    state: present
    update_cache: true
  become: true

# Check if nvidia-smi is already installed and communicating with the Quadro T1000.
- name: Check if NVIDIA GPU drivers are active
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_check
  ignore_errors: true
  changed_when: false

# Automatically install the recommended proprietary NVIDIA driver for the Quadro T1000
# if nvidia-smi is missing or failing.
- name: Install recommended NVIDIA drivers for Quadro T1000
  ansible.builtin.command: ubuntu-drivers install
  when: nvidia_smi_check.rc != 0
  register: nvidia_driver_install
  become: true

# Notify the user and halt the playbook if a new NVIDIA kernel module was just installed,
# since a reboot is required before Ollama can detect the Quadro T1000 VRAM.
- name: Fail with reboot notice if NVIDIA drivers were newly installed
  ansible.builtin.fail:
    msg: >-
      NVIDIA drivers were installed for your Quadro T1000. Please reboot your
      Dell Precision 7550 now and re-run this playbook so Ollama can detect the GPU.
  when:
    - nvidia_smi_check.rc != 0
    - nvidia_driver_install.changed

# Download and run the official Ollama installer if the binary is not already present.
- name: Install Ollama
  ansible.builtin.shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama
  become: true

# Create the systemd drop-in directory for Ollama service overrides.
- name: Ensure Ollama systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Configure OLLAMA_MAX_LOADED_MODELS=2 so the 1.5B model stays pinned in the
# Quadro T1000 (4GB VRAM) while the 14B model remains loaded in your 64GB RAM.
- name: Configure Ollama to keep two models loaded simultaneously
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/override.conf
    content: |
      [Service]
      Environment="OLLAMA_MAX_LOADED_MODELS=2"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama
  become: true

# Flush handlers immediately so Ollama restarts with the new environment variables
# before pulling and loading models.
- name: Apply systemd changes immediately
  ansible.builtin.meta: flush_handlers

# Ensure the Ollama background service is active and enabled on boot.
- name: Ensure Ollama service is enabled and running
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true
  become: true

# Pull the lightweight 1.5B model (~1.5-2GB), fitting 100% inside the Quadro T1000
# VRAM for lag-free, real-time code autocomplete.
- name: Pull Qwen 2.5 Coder 1.5B for GPU autocomplete
  ansible.builtin.command: ollama pull qwen2.5-coder:1.5b
  register: pull_1_5b
  changed_when: "'pulling' in pull_1_5b.stderr or 'downloading' in pull_1_5b.stderr"

# Pull the 14B model (~9-11GB), which offloads to your 64GB system RAM and 12 Xeon
# threads for high-accuracy chat and multi-file agentic editing.
- name: Pull Qwen 2.5 Coder 14B for CPU/RAM chat and agent
  ansible.builtin.command: ollama pull qwen2.5-coder:14b
  register: pull_14b
  changed_when: "'pulling' in pull_14b.stderr or 'downloading' in pull_14b.stderr"

# Copy the custom Modelfile that expands the context window to 16384 tokens so
# Roo Code can read multiple files without truncating project history.
- name: Copy custom Modelfile for expanded agent context window
  ansible.builtin.copy:
    src: Modelfile-agent
    dest: /tmp/Modelfile-agent
    mode: "0644"

# Check existing Ollama models to avoid recreating the custom agent model unnecessarily.
- name: Check existing Ollama models
  ansible.builtin.command: ollama list
  register: ollama_models
  changed_when: false

# Build the custom 14B agent model with the 16k context window parameter.
- name: Create qwen2.5-coder-agent:14b with 16384 context window
  ansible.builtin.command: ollama create qwen2.5-coder-agent:14b -f /tmp/Modelfile-agent
  when: "'qwen2.5-coder-agent:14b' not in ollama_models.stdout"

# Clean up the temporary Modelfile after creating the custom model.
- name: Remove temporary Modelfile
  ansible.builtin.file:
    path: /tmp/Modelfile-agent
    state: absent

# Install Continue (autocomplete + chat) and Roo Code (autonomous file agent)
# into VS Code for the target user.
- name: Install Continue and Roo Code extensions in VS Code
  ansible.builtin.command: "code --install-extension {{ item }}"
  loop:
    - Continue.continue
    - RooVeterinaryInc.roo-cline
  register: vscode_ext
  changed_when: "'successfully installed' in vscode_ext.stdout"

# Ensure the Continue configuration directory exists in the user's home folder.
- name: Ensure ~/.continue directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.continue"
    state: directory
    mode: "0755"

# Deploy ~/.continue/config.yaml routing autocomplete to the GPU 1.5B model
# and chat/edit tasks to the 14B custom agent model.
- name: Deploy Continue configuration file
  ansible.builtin.template:
    src: continue_config.yaml.j2
    dest: "{{ ansible_env.HOME }}/.continue/config.yaml"
    mode: "0644"
