---
all:

  children:

    HomeLab:

      hosts:
      
        Precision:
          ansible_host: 192.168.0.200

      vars:

        architecture:       x86_64
        architecture_alias: amd64

        # The target user for the HomeLab server setup. This variable is used to determine the user under which certain tasks will be executed. It defaults to the SUDO_USER environment variable if available, or falls back to the USER environment variable if SUDO_USER is not set.
        target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

        # Common CLI tools to install
        cli_tools:
          - curl
          - vim
          - git
          - tar

        # Network configuration for virbr8
        bridge:
          name:    "virbr8"
          ip:      "192.168.8.200"
          netmask: "255.255.255.0"
          dhcp:
            start: "192.168.8.101"
            end:   "192.168.8.199"

        # Kubernetes configuration
        kubernetes:
          version: "v1.37"
          bind_ip: "{{ bridge.ip }}"
          pod_network_cidr: "10.244.0.0/16"
          service_cidr: "10.96.0.0/12"
          firewall_ports:
            - { port: "6443", protocol: tcp }
            - { port: "2379-2380", protocol: tcp }
            - { port: "10250", protocol: tcp }
            - { port: "10259", protocol: tcp }
            - { port: "10257", protocol: tcp }
            - { port: "30000-32767", protocol: tcp }
            - { port: "4240", protocol: tcp }
            - { port: "8472", protocol: udp }