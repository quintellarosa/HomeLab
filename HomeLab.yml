---
- name: HomeLab Server Setup
  hosts: HomeLab
  become: true
  roles:
    - role: SystemUpdate
    - role: CliTools
    - role: Gh
    - role: GoogleChrome
    - role: VsCode
    - role: Virtualization
    - role: virbr8
    - role: Docker
    - role: Kubernetes
    - role: PostgreSQL
      vars:
        postgresql_additional_client_networks:
          - "{{ kubernetes.pod_network_cidr }}"
    - role: Cilium
    #- role: AWX
