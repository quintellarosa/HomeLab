---
- name: Ensure OS family is supported by K8sCNICilium role
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}' for K8sCNICilium role (supported: Debian, RedHat, Suse)."

# ---------------------------------------------------------------------------
# 1. Install Cilium CLI binary (Debian, RedHat, SUSE — amd64 / arm64)
# ---------------------------------------------------------------------------
- name: Determine Cilium CLI architecture slug
  ansible.builtin.set_fact:
    _cilium_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'amd64': 'amd64',
          'aarch64': 'arm64',
          'arm64': 'arm64',
        }[ansible_facts['architecture']] | default('')
      }}

- name: Ensure host architecture is supported by Cilium CLI
  ansible.builtin.assert:
    that:
      - _cilium_arch in ['amd64', 'arm64']
    fail_msg: "Unsupported architecture '{{ ansible_facts['architecture'] }}' for Cilium CLI (supported: x86_64/amd64, aarch64/arm64)."

- name: Check installed Cilium CLI version
  ansible.builtin.command:
    cmd: "{{ cilium_install_dir }}/cilium version --client"
  register: _cilium_cli_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install or update Cilium CLI {{ cilium_cli_version }}
  when: >-
    (_cilium_cli_installed.rc != 0)
    or (cilium_cli_version not in (_cilium_cli_installed.stdout | default('')))
  block:
    - name: Fetch Cilium CLI SHA-256 checksum
      ansible.builtin.uri:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ _cilium_arch }}.tar.gz.sha256sum"
        return_content: true
      register: _cilium_cli_sha256_resp
      check_mode: false

    - name: Parse Cilium CLI SHA-256 checksum
      ansible.builtin.set_fact:
        _cilium_cli_sha256: "{{ (_cilium_cli_sha256_resp.content | trim).split()[0] }}"

    - name: Download Cilium CLI archive with SHA-256 verification
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ _cilium_arch }}.tar.gz"
        dest: "/tmp/cilium-linux-{{ _cilium_arch }}.tar.gz"
        checksum: "sha256:{{ _cilium_cli_sha256 }}"
        mode: "0644"

    - name: Ensure Cilium CLI install directory exists
      ansible.builtin.file:
        path: "{{ cilium_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract Cilium CLI binary to {{ cilium_install_dir }}
      ansible.builtin.unarchive:
        src: "/tmp/cilium-linux-{{ _cilium_arch }}.tar.gz"
        dest: "{{ cilium_install_dir }}"
        remote_src: true
        include:
          - cilium
        owner: root
        group: root
        mode: "0755"
      when: not ansible_check_mode

    - name: Clean up downloaded Cilium CLI archive
      ansible.builtin.file:
        path: "/tmp/cilium-linux-{{ _cilium_arch }}.tar.gz"
        state: absent

# ---------------------------------------------------------------------------
# 2. Detect libvirt virtual NIC for firewall scoping (works standalone too)
# ---------------------------------------------------------------------------
- name: Check if libvirt (virsh) is installed for Cilium firewall scoping
  ansible.builtin.stat:
    path: /usr/bin/virsh
  register: _cilium_virsh_bin

- name: Query libvirt default network for its virtual bridge NIC
  ansible.builtin.command:
    cmd: "virsh net-info {{ cilium_libvirt_network_name }}"
  register: _cilium_libvirt_net_info
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cilium_bind_libvirt_nic | bool
    - _cilium_virsh_bin.stat.exists

- name: Refresh network facts for Cilium
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - network

- name: Resolve libvirt virtual NIC for Cilium firewall rules
  ansible.builtin.set_fact:
    _cilium_libvirt_bridge_candidates: >-
      {{
        (
          _cilium_libvirt_net_info.stdout
          | default('')
          | regex_search('(?m)^Bridge:\s+(\S+)', '\1')
        )
        | default([], true)
      }}

- name: Select candidate libvirt virtual NIC for Cilium
  ansible.builtin.set_fact:
    _cilium_detected_libvirt_nic: >-
      {{
        (_cilium_libvirt_bridge_candidates | first)
        if (_cilium_libvirt_bridge_candidates | length > 0 and (_cilium_libvirt_bridge_candidates | first) not in ['', '-'])
        else (
          network.name
          if (network is defined and network.name is defined and (network.name in ansible_facts))
          else ''
        )
      }}

- name: Decide whether Cilium firewall rules should scope to libvirt virtual NIC
  ansible.builtin.set_fact:
    _cilium_use_libvirt_nic: >-
      {{
        (cilium_bind_libvirt_nic | bool)
        and (_cilium_virsh_bin.stat.exists | bool)
        and (_cilium_detected_libvirt_nic | length > 0)
        and (_cilium_detected_libvirt_nic in ansible_facts)
        and (ansible_facts[_cilium_detected_libvirt_nic]['ipv4']['address'] is defined)
      }}

- name: Set Cilium target interface and CIDR
  ansible.builtin.set_fact:
    _cilium_target_interface: >-
      {{
        _cilium_detected_libvirt_nic
        if (_cilium_use_libvirt_nic | bool)
        else (ansible_facts['default_ipv4']['interface'] | default(''))
      }}
    _cilium_allowed_cidr: >-
      {{
        (
          ansible_facts[_cilium_detected_libvirt_nic]['ipv4']['network']
          ~ '/'
          ~ ansible_facts[_cilium_detected_libvirt_nic]['ipv4']['prefix']
        )
        if (_cilium_use_libvirt_nic | bool)
        else ''
      }}

# ---------------------------------------------------------------------------
# 3. Firewall rules for Cilium (UFW on Debian, firewalld on RedHat / SUSE)
# ---------------------------------------------------------------------------
- name: Check if UFW is installed (Debian)
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: _cilium_ufw_bin
  when:
    - cilium_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Open Cilium ports in UFW on libvirt NIC (Debian)
  ansible.builtin.command:
    cmd: >-
      ufw allow in on {{ _cilium_target_interface }}
      from {{ _cilium_allowed_cidr }}
      to any port {{ item.port }}
      proto {{ item.proto }}
      comment '{{ item.comment }}'
  loop: "{{ cilium_firewall_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  register: _cilium_ufw_libvirt_rules
  changed_when: >-
    'Rule added' in _cilium_ufw_libvirt_rules.stdout
    or 'Rules updated' in _cilium_ufw_libvirt_rules.stdout
  when:
    - cilium_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'
    - _cilium_ufw_bin.stat.exists | default(false)
    - _cilium_use_libvirt_nic | bool

- name: Open Cilium ports in UFW for vanilla installation (Debian)
  ansible.builtin.command:
    cmd: >-
      ufw allow {{ item.port }}/{{ item.proto }}
      comment '{{ item.comment }}'
  loop: "{{ cilium_firewall_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  register: _cilium_ufw_vanilla_rules
  changed_when: >-
    'Rule added' in _cilium_ufw_vanilla_rules.stdout
    or 'Rules updated' in _cilium_ufw_vanilla_rules.stdout
  when:
    - cilium_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'
    - _cilium_ufw_bin.stat.exists | default(false)
    - not (_cilium_use_libvirt_nic | bool)

- name: Gather systemd service facts to detect firewalld
  ansible.builtin.service_facts:

- name: Open Cilium ports in firewalld (RedHat / SUSE)
  when:
    - cilium_configure_firewall | bool
    - ansible_facts['os_family'] in ['RedHat', 'Suse']
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
  block:
    - name: Detect firewalld zone for {{ _cilium_target_interface }}
      ansible.builtin.command:
        cmd: "firewall-cmd --get-zone-of-interface={{ _cilium_target_interface }}"
      register: _cilium_firewalld_iface_zone
      changed_when: false
      failed_when: false
      check_mode: false
      when: _cilium_target_interface | length > 0

    - name: Detect default firewalld zone if interface is unassigned
      ansible.builtin.command:
        cmd: firewall-cmd --get-default-zone
      register: _cilium_firewalld_default_zone
      changed_when: false
      check_mode: false
      when: (_cilium_target_interface | length == 0) or (_cilium_firewalld_iface_zone.rc | default(1) != 0)

    - name: Set target firewalld zone for Cilium
      ansible.builtin.set_fact:
        _cilium_firewalld_zone: >-
          {{
            (_cilium_firewalld_iface_zone.stdout | trim)
            if (_cilium_target_interface | length > 0 and _cilium_firewalld_iface_zone.rc | default(1) == 0)
            else (_cilium_firewalld_default_zone.stdout | trim)
          }}

    - name: Check Cilium ports in firewalld zone
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone={{ _cilium_firewalld_zone }} --query-port={{ item.port }}/{{ item.proto }}"
      loop: "{{ cilium_firewall_ports }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto }}"
      register: _cilium_firewalld_queries
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Allow Cilium ports in firewalld zone
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone={{ _cilium_firewalld_zone }} --add-port={{ item.item.port }}/{{ item.item.proto }}"
      loop: "{{ _cilium_firewalld_queries.results }}"
      loop_control:
        label: "{{ item.item.port }}/{{ item.item.proto }}"
      when: item.rc != 0
      changed_when: true
      register: _cilium_firewalld_added

    - name: Reload firewalld to apply Cilium rules
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: _cilium_firewalld_added is changed
      changed_when: true

# ---------------------------------------------------------------------------
# 4. Render Cilium Helm values and install / upgrade Cilium CNI
# ---------------------------------------------------------------------------
- name: Check that Kubernetes kubeconfig exists
  ansible.builtin.stat:
    path: "{{ cilium_kubeconfig }}"
  register: _cilium_kubeconfig_stat

- name: Verify Kubernetes control plane is initialized before installing Cilium
  ansible.builtin.assert:
    that:
      - _cilium_kubeconfig_stat.stat.exists
    fail_msg: >-
      Kubernetes kubeconfig '{{ cilium_kubeconfig }}' was not found.
      Run the K8sMasterInstall role (or initialize the cluster with kubeadm) before running the K8sCNICilium role.
  when: not ansible_check_mode

- name: Ensure parent directory for Cilium values file exists
  ansible.builtin.file:
    path: "{{ cilium_values_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read Kubernetes API server URL from kubeconfig for kube-proxy replacement
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ cilium_kubeconfig }}
      config view --minify
      -o jsonpath='{.clusters[0].cluster.server}'
  register: _cilium_k8s_server_url
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cilium_kube_proxy_replacement | bool
    - _cilium_kubeconfig_stat.stat.exists

- name: Resolve Kubernetes API server host and port for Cilium
  ansible.builtin.set_fact:
    _cilium_resolved_k8s_host: >-
      {{
        cilium_k8s_service_host
        if (cilium_k8s_service_host | default('') | length > 0)
        else (
          (_cilium_k8s_server_url.stdout | default('') | trim)
          | regex_replace('^https?://([^:/]+).*$', '\1')
        )
      }}
    _cilium_resolved_k8s_port: >-
      {{
        cilium_k8s_service_port
        if (cilium_k8s_service_port | default('') | string | length > 0)
        else (
          (
            (_cilium_k8s_server_url.stdout | default('') | trim)
            | regex_replace('^https?://[^:]+:([0-9]+).*$', '\1')
          )
          if (':' in ((_cilium_k8s_server_url.stdout | default('') | trim) | regex_replace('^https?://', '')))
          else '6443'
        )
      }}

- name: Render Cilium Helm values file
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: "{{ cilium_values_file }}"
    owner: root
    group: root
    mode: "0644"
  register: _cilium_values_rendered

- name: Deploy or upgrade Cilium CNI in the Kubernetes cluster
  when:
    - _cilium_kubeconfig_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: Wait for Kubernetes API server to respond
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ cilium_kubeconfig }} get nodes"
      register: _cilium_api_ready
      retries: 12
      delay: 5
      until: _cilium_api_ready.rc == 0
      changed_when: false

    - name: Remove default kube-proxy DaemonSet when Cilium kube-proxy replacement is enabled
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cilium_kubeconfig }}
          -n kube-system delete daemonset kube-proxy --ignore-not-found
      register: _cilium_kube_proxy_ds_del
      changed_when: "'deleted' in _cilium_kube_proxy_ds_del.stdout"
      when: cilium_kube_proxy_replacement | bool

    - name: Remove default kube-proxy ConfigMap when Cilium kube-proxy replacement is enabled
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cilium_kubeconfig }}
          -n kube-system delete configmap kube-proxy --ignore-not-found
      register: _cilium_kube_proxy_cm_del
      changed_when: "'deleted' in _cilium_kube_proxy_cm_del.stdout"
      when: cilium_kube_proxy_replacement | bool

    - name: Check whether Cilium DaemonSet is already installed
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cilium_kubeconfig }}
          -n {{ cilium_namespace }}
          get daemonset cilium
          -o jsonpath='{.spec.template.spec.containers[0].image}'
      register: _cilium_existing_ds
      changed_when: false
      failed_when: false

    - name: Install Cilium CNI {{ cilium_version }}
      ansible.builtin.command:
        cmd: >-
          {{ cilium_install_dir }}/cilium install
          --kubeconfig {{ cilium_kubeconfig }}
          --namespace {{ cilium_namespace }}
          --version {{ cilium_version }}
          --values {{ cilium_values_file }}
          --wait
          --wait-duration {{ cilium_wait_duration }}
      when: _cilium_existing_ds.rc != 0
      register: _cilium_installed
      changed_when: true

    - name: Upgrade Cilium CNI when values or target version changed
      ansible.builtin.command:
        cmd: >-
          {{ cilium_install_dir }}/cilium upgrade
          --kubeconfig {{ cilium_kubeconfig }}
          --namespace {{ cilium_namespace }}
          --version {{ cilium_version }}
          --values {{ cilium_values_file }}
          --wait
          --wait-duration {{ cilium_wait_duration }}
      when:
        - _cilium_existing_ds.rc == 0
        - (_cilium_values_rendered.changed) or (cilium_version not in (_cilium_existing_ds.stdout | default('')))
      register: _cilium_upgraded
      changed_when: true

    - name: Verify Cilium cluster status after install or upgrade
      ansible.builtin.command:
        cmd: >-
          {{ cilium_install_dir }}/cilium status
          --kubeconfig {{ cilium_kubeconfig }}
          --namespace {{ cilium_namespace }}
          --wait
          --wait-duration {{ cilium_wait_duration }}
      when: (_cilium_installed is changed) or (_cilium_upgraded is changed)
      changed_when: false

    - name: Wait for control-plane node to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ cilium_kubeconfig }}
          wait --for=condition=Ready nodes --all --timeout=180s
      when: (_cilium_installed is changed) or (_cilium_upgraded is changed)
      changed_when: false

    - name: Report Cilium CNI setup summary
      ansible.builtin.debug:
        msg: >-
          Cilium {{ cilium_version }} (CLI {{ cilium_cli_version }}) is active in namespace '{{ cilium_namespace }}'
          (IPAM: {{ cilium_ipam_mode }}, routing: {{ cilium_routing_mode }}/{{ cilium_tunnel_protocol }},
          kubeProxyReplacement: {{ cilium_kube_proxy_replacement }},
          Ingress: {{ cilium_ingress_enabled }}/{{ cilium_ingress_loadbalancer_mode }},
          operator replicas: {{ cilium_operator_replicas }}, Hubble: {{ cilium_hubble_enabled }}).
      when: (_cilium_installed is changed) or (_cilium_upgraded is changed)
