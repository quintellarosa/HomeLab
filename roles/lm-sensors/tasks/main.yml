---
- name: Validate lm-sensors platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat", "Suse"]
    fail_msg: "lm-sensors installation supports Debian, RedHat, and SUSE systems."

- name: Install lm-sensors on Debian-family systems
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install lm-sensors on RedHat-family systems
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Install lm-sensors on SUSE-family systems
  ansible.builtin.include_tasks: SUSE.yml
  when: ansible_facts['os_family'] == "Suse"
