---
- name: Install virtualization group
  ansible.builtin.dnf:
    name: "@virtualization"
    state: present

- name: Enable IOMMU using grubby
  ansible.builtin.command:
    cmd: "grubby --update-kernel=ALL --args='{{ iommu_args }}'"
  when:
    - not virtualization_is_guest
    - iommu_args not in ansible_facts['cmdline']
  notify: Reboot required notice
