---
- name: Validate active disk profile and secret requirements
  ansible.builtin.assert:
    that:
      - active_disk_profile.os_disk_serial | length > 0
      - (active_disk_profile.home_fs_uuid | length > 0) or (active_disk_profile.home_fs_label | length > 0)
      - active_disk_profile.os_disk_serial not in active_disk_profile.protected_disk_serials
      - user_password_hash is defined
      - user_password_hash | length > 0
      - "'replaceme' not in user_password_hash"
    fail_msg: >-
      Missing or invalid configuration. Check group_vars/all/disks.yml and ensure
      group_vars/secrets.yml exists with a valid SHA-512 user_password_hash
      (generate with: openssl passwd -6).

- name: Ensure build directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ iso_cache_dir }}"
    - "{{ ventoy_stage_dir }}/ventoy"
    - "{{ ventoy_stage_dir }}/iso"
    - "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}"

- name: Download and verify distro ISO
  ansible.builtin.include_tasks: download_iso.yml
  when: not (skip_iso_download | bool)

- name: Render Ubuntu autoinstall and cidata artifacts
  ansible.builtin.include_tasks: render_ubuntu.yml
  when: active_distro.template_type == "ubuntu_autoinstall"

- name: Render Ventoy configuration
  ansible.builtin.template:
    src: ventoy.json.j2
    dest: "{{ ventoy_stage_dir }}/ventoy/ventoy.json"
    mode: "0644"

- name: Sync staged files to mounted Ventoy USB
  ansible.builtin.include_tasks: sync_ventoy.yml
  when: sync_usb_mount_dir | length > 0
