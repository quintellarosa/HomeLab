---
- name: Ensure host architecture is supported by Google Chrome
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ['x86_64', 'amd64']
    fail_msg: "Google Chrome for Linux only supports x86_64/amd64 (detected: '{{ ansible_facts['architecture'] }}')."

- name: Configure Google Chrome repository on Debian family
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure Google Chrome repository on RedHat family
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Google Chrome
  ansible.builtin.package:
    name: "{{ google_chrome_package }}"
    state: present
