---
target_user: "{{ ansible_user | default(lookup('env', 'USER'), true) }}"
backstage:
  host: "{{ ansible_host }}"
  namespace: backstage
  kubeconfig: "/home/{{ target_user }}/.kube/config"
  image: ghcr.io/backstage/backstage:latest
  replicas: 1
  nodeport: 30081
  public_url: "https://192.168.122.41"
  frontend:
    port: 3000
  backend:
    port: 7007
  database:
    name: backstage
    user: backstage
    password: backstage
    host: "127.0.0.1"
    port: 5432
