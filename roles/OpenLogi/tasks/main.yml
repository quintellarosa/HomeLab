---
- name: Validate OpenLogi platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat"]
      - ansible_facts['architecture'] == "x86_64"
    fail_msg: "OpenLogi package installation supports 64-bit Debian and RedHat-family systems."

- name: Validate OpenLogi package configuration
  ansible.builtin.assert:
    that:
      - openlogi.version | length > 0
      - openlogi.release_tag | length > 0
      - openlogi.debian_package_url | length > 0
      - openlogi.redhat_package_url | length > 0

- name: Install OpenLogi on Debian-family systems
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install OpenLogi on RedHat-family systems
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Load uinput now
  ansible.builtin.command:
    argv:
      - modprobe
      - uinput
  changed_when: false

- name: Load uinput at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/openlogi.conf
    mode: '0644'
    content: "uinput\n"
