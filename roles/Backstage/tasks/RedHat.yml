---
- name: Install Backstage Kubernetes Python prerequisites on RedHat
  ansible.builtin.dnf:
    name:
      - python3-pip
    state: present

- name: Install Kubernetes Python client for Backstage
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML
    virtualenv: /opt/backstage/venv
    virtualenv_command: python3 -m venv
    state: present

- name: Use the Backstage Python virtualenv
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/backstage/venv/bin/python
