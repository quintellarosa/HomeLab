---
- name: Validate AWX platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat"]
    fail_msg: "AWX Operator setup is supported only on Debian- and RedHat-family systems."

- name: Require a valid AWX PostgreSQL password
  ansible.builtin.assert:
    that:
      - awx_postgres_password | length > 0
      - awx_postgres_password.find("'") == -1
      - awx_postgres_password.find('"') == -1
      - awx_postgres_password.find("\\") == -1
    fail_msg: >-
      Set AWX_POSTGRES_PASSWORD in the environment or provide awx_postgres_password
      through Ansible Vault. The password must not contain quotes or backslashes.

- name: Get the latest AWX Operator release
  ansible.builtin.uri:
    url: "{{ awx_operator_latest_release_api }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    return_content: true
    status_code: 200
  register: awx_operator_release

- name: Save the latest AWX Operator release tag
  ansible.builtin.set_fact:
    awx_operator_version: "{{ awx_operator_release.json.tag_name }}"

- name: Validate the AWX Operator release tag
  ansible.builtin.assert:
    that:
      - awx_operator_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "GitHub returned an unexpected AWX Operator release tag: {{ awx_operator_version }}"

- name: Install Kubernetes Python client dependencies
  ansible.builtin.package:
    name: "{{ awx_operator_python_packages[ansible_facts['os_family']] }}"
    state: present

- name: Create the AWX PostgreSQL role
  community.postgresql.postgresql_user:
    login_db: postgres
    login_user: postgres
    login_unix_socket: "{{ awx_postgres_socket }}"
    name: "{{ awx_postgres_username }}"
    password: "{{ awx_postgres_password }}"
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"
  no_log: true

- name: Create the AWX PostgreSQL database
  community.postgresql.postgresql_db:
    login_user: postgres
    login_unix_socket: "{{ awx_postgres_socket }}"
    name: "{{ awx_postgres_database }}"
    owner: "{{ awx_postgres_username }}"
    encoding: UTF-8
    state: present
  become_user: postgres

- name: Get the AWX controller user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"

- name: Verify the Kubernetes kubeconfig exists
  ansible.builtin.stat:
    path: "{{ awx_operator_kubeconfig }}"
  register: awx_operator_kubeconfig_file

- name: Require the Kubernetes cluster kubeconfig
  ansible.builtin.assert:
    that:
      - awx_operator_kubeconfig_file.stat.exists
    fail_msg: "Kubernetes kubeconfig {{ awx_operator_kubeconfig }} is missing."

- name: Create the AWX Operator namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ awx_operator_namespace }}"
    state: present

- name: Render official AWX Operator manifests with Kustomize
  ansible.builtin.command:
    argv:
      - kubectl
      - kustomize
      - "{{ awx_operator_kustomize_base }}?ref={{ awx_operator_version }}"
  register: awx_operator_manifests
  changed_when: false

- name: Validate the rendered kube-rbac-proxy image
  ansible.builtin.assert:
    that:
      - awx_operator_rbac_proxy_source_image in awx_operator_manifests.stdout or awx_operator_rbac_proxy_image in awx_operator_manifests.stdout
    fail_msg: >-
      The AWX Operator manifests contain neither {{ awx_operator_rbac_proxy_source_image }}
      nor {{ awx_operator_rbac_proxy_image }}. Review the image override before deploying this release.

- name: Replace the retired kube-rbac-proxy registry
  ansible.builtin.set_fact:
    awx_operator_manifests_patched: >-
      {{ awx_operator_manifests.stdout | replace(awx_operator_rbac_proxy_source_image, awx_operator_rbac_proxy_image) }}

- name: Verify the rendered manifests use the replacement kube-rbac-proxy image
  ansible.builtin.assert:
    that:
      - awx_operator_rbac_proxy_source_image not in awx_operator_manifests_patched
      - awx_operator_rbac_proxy_image in awx_operator_manifests_patched
    fail_msg: "The AWX Operator manifests could not be updated to use {{ awx_operator_rbac_proxy_image }}."

- name: Deploy official AWX Operator manifests
  kubernetes.core.k8s:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    state: present
    definition: "{{ awx_operator_manifests_patched | from_yaml_all }}"

- name: Wait for the AWX Operator controller deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: awx-operator-controller-manager
    namespace: "{{ awx_operator_namespace }}"
  register: awx_operator_controller
  until: >-
    awx_operator_controller.resources | length > 0 and
    (awx_operator_controller.resources[0].status | default({})).availableReplicas | default(0) | int > 0
  retries: 30
  delay: 10

- name: Create the AWX external PostgreSQL configuration secret
  kubernetes.core.k8s:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ awx_postgres_configuration_secret }}"
        namespace: "{{ awx_operator_namespace }}"
      type: Opaque
      stringData:
        host: "{{ awx_postgres_host }}"
        port: "{{ awx_postgres_port | string }}"
        database: "{{ awx_postgres_database }}"
        username: "{{ awx_postgres_username }}"
        password: "{{ awx_postgres_password }}"
        sslmode: prefer
        target_session_attrs: read-write
        type: unmanaged
  no_log: true

- name: Create the AWX instance using the external PostgreSQL database
  kubernetes.core.k8s:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    state: present
    definition:
      apiVersion: awx.ansible.com/v1beta1
      kind: AWX
      metadata:
        name: "{{ awx_instance_name }}"
        namespace: "{{ awx_operator_namespace }}"
      spec:
        postgres_configuration_secret: "{{ awx_postgres_configuration_secret }}"

- name: Wait for the AWX web deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ awx_operator_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ awx_instance_name }}-web"
    namespace: "{{ awx_operator_namespace }}"
  register: awx_web_deployment
  until: >-
    awx_web_deployment.resources | length > 0 and
    (awx_web_deployment.resources[0].status | default({})).availableReplicas | default(0) | int > 0
  retries: 60
  delay: 10
