---
all:

  vars:
    ansible_user:                 "{{ lookup('env', 'USER') }}"
    ansible_ssh_private_key_file: /home/{{ lookup('env', 'USER') }}/.ssh/id_ed25519


  children:

    Workstation:

      hosts:
      
        LclLnxLabNotbk:
          ansible_host:       Precision.quintellarosa.home

    Hypervisors:
    
      hosts:
        LclLnxLabVirt01:
          ansible_host:       Precision.quintellarosa.home


    PostgreSQL:

      hosts:
        LclLnxLabPSQL01:
          ansible_host:       LclLnxLabPSQL01.quintellarosa.home

    
    Kubernetes:

      hosts:

        LclLnxLabK8sM01:
          ansible_host:       LclLnxLabK8sM01.quintellarosa.home

    AWX:

      hosts:

        LclLnxLabK8sM01:
          ansible_host:       LclLnxLabK8sM01.quintellarosa.home

      vars:
        awx:
          admin_user:         admin
          admin_password:     admin
          secret_key:         "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"    
          postgresql:
            host:             LclLnxLabPSQL01.quintellarosa.home
            port:             5432
            database:         awx
            user:             awx
            password:         awx

    Backstage:

      hosts:

        LclLnxLabK8sM01:
          ansible_host:       LclLnxLabK8sM01.quintellarosa.home

      vars:
        caddy:
          sites:
            - address: "192.168.122.41"
              upstream: "http://127.0.0.1:30081"
        backstage:
          host:             LclLnxLabK8sM01.quintellarosa.home
          namespace:        backstage
          kubeconfig:       "/home/{{ ansible_user }}/.kube/config"
          image:            ghcr.io/backstage/backstage:latest
          replicas:         1
          public_url:       https://192.168.122.41
          nodeport:         30081
          app:
            name:             backstage
            directory:        "/home/{{ ansible_user }}/backstage"
            create_app_package: "@backstage/create-app@latest"
          node:
            minimum_version:  "24.15.0"
          yarn:
            version:          "4.4.1"
          database:
            name:             backstage
            user:             backstage
            password:         backstage
            host:             LclLnxLabPSQL01.quintellarosa.home
            port:             5432
          frontend:
            port:             3000
          backend:
            port:             7007


    
