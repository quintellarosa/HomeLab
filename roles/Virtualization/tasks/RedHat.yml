---
- name: Install virtualization group
  ansible.builtin.dnf:
    name: "@virtualization"
    state: present

- name: Read GRUB kernel arguments
  ansible.builtin.command:
    cmd: grubby --info=ALL
  register: virtualization_grubby_info
  changed_when: false
  when: not virtualization_is_guest

- name: Verify GRUB kernel entries are available
  ansible.builtin.assert:
    that:
      - virtualization_grubby_info.stdout_lines | select('match', '^args=') | list | length > 0
    fail_msg: "Cannot enable IOMMU because grubby did not report any kernel arguments."
  when: not virtualization_is_guest

- name: Determine IOMMU arguments missing from GRUB kernel entries
  ansible.builtin.set_fact:
    iommu_args_to_add: >-
      {{
        ([iommu_vendor_arg ~ '=on'] if
          (virtualization_grubby_info.stdout_lines | select('match', '^args=') | select('search', iommu_vendor_arg ~ '=on') | list | length)
          < (virtualization_grubby_info.stdout_lines | select('match', '^args=') | list | length)
        else [])
        + (['iommu=pt'] if
          (virtualization_grubby_info.stdout_lines | select('match', '^args=') | select('search', 'iommu=pt') | list | length)
          < (virtualization_grubby_info.stdout_lines | select('match', '^args=') | list | length)
        else [])
      }}
  when: not virtualization_is_guest

- name: Enable IOMMU using grubby
  ansible.builtin.command:
    cmd: "grubby --update-kernel=ALL --args='{{ iommu_args_to_add | join(' ') }}'"
  when:
    - not virtualization_is_guest
    - iommu_args_to_add | length > 0
  notify: Reboot required notice
