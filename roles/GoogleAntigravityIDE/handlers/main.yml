---
- name: Update desktop database
  ansible.builtin.command:
    cmd: update-desktop-database /usr/share/applications
  changed_when: false
  failed_when: false

- name: Reload Antigravity IDE AppArmor profile
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/antigravity-ide
  changed_when: true
