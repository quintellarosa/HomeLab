---
ubuntu_gnome_user: "{{ target_user | default(lookup('ansible.builtin.env', 'SUDO_USER') or lookup('ansible.builtin.env', 'USER'), true) }}"

# Appearance
ubuntu_gnome_color_scheme: "prefer-dark"
ubuntu_gnome_accent_color: "orange"
ubuntu_gnome_gtk_theme: "Yaru-dark"
ubuntu_gnome_icon_theme: "Yaru-dark"

# Desktop Icons (DING extension)
ubuntu_gnome_desktop_icon_size: "small"
ubuntu_gnome_desktop_start_corner: "top-left"

# Ubuntu Dock (dash-to-dock extension)
ubuntu_gnome_dock_panel_mode: false
ubuntu_gnome_dock_icon_size: 32
ubuntu_gnome_dock_position: "BOTTOM"
ubuntu_gnome_dock_show_mounts: false

# Keyboard Input Sources (ordered list of [type, layout] pairs)
# ('xkb', 'br')      = Portuguese (Brazil)
# ('xkb', 'us+intl') = English (US, intl., with dead keys)
ubuntu_gnome_input_sources:
  - ["xkb", "br"]
  - ["xkb", "us+intl"]

# Exact GSettings (schema, key, GVariant value) mapping applied by the role
ubuntu_gnome_gsettings:
  - schema: org.gnome.desktop.interface
    key: color-scheme
    value: "'{{ ubuntu_gnome_color_scheme }}'"
  - schema: org.gnome.desktop.interface
    key: accent-color
    value: "'{{ ubuntu_gnome_accent_color }}'"
  - schema: org.gnome.desktop.interface
    key: gtk-theme
    value: "'{{ ubuntu_gnome_gtk_theme }}'"
  - schema: org.gnome.desktop.interface
    key: icon-theme
    value: "'{{ ubuntu_gnome_icon_theme }}'"
  - schema: org.gnome.shell.extensions.ding
    key: icon-size
    value: "'{{ ubuntu_gnome_desktop_icon_size }}'"
  - schema: org.gnome.shell.extensions.ding
    key: start-corner
    value: "'{{ ubuntu_gnome_desktop_start_corner }}'"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: extend-height
    value: "{{ ubuntu_gnome_dock_panel_mode | bool | lower }}"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: dash-max-icon-size
    value: "{{ ubuntu_gnome_dock_icon_size | int }}"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: dock-position
    value: "'{{ ubuntu_gnome_dock_position }}'"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: show-mounts
    value: "{{ ubuntu_gnome_dock_show_mounts | bool | lower }}"
  - schema: org.gnome.desktop.input-sources
    key: sources
    value: >-
      [{% for src in ubuntu_gnome_input_sources %}('{{ src[0] }}', '{{ src[1] }}'){{ ', ' if not loop.last else '' }}{% endfor %}]
