---
- name: Ensure OS family is supported by Kubernetes role
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}' for Kubernetes role (supported: Debian, RedHat, Suse)."

# ---------------------------------------------------------------------------
# 1. Disable swap (kubeadm requirement)
# ---------------------------------------------------------------------------
- name: Disable swap permanently and at runtime
  when: kubernetes_disable_swap | bool
  block:
    - name: Check for active swap devices or files
      ansible.builtin.command:
        cmd: swapon --noheadings --show
      register: _kubernetes_active_swap
      changed_when: false
      check_mode: false

    - name: Turn off all active swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: (_kubernetes_active_swap.stdout | trim | length) > 0
      changed_when: true

    - name: Comment out swap entries in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Check if systemd zram-generator defaults exist (e.g. Fedora/SUSE)
      ansible.builtin.stat:
        path: /usr/lib/systemd/zram-generator.conf
      register: _kubernetes_zram_defaults

    - name: Override systemd zram-generator to disable zram swap on boot
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (Kubernetes role) - disable zram swap for kubeadm
      when: _kubernetes_zram_defaults.stat.exists

# ---------------------------------------------------------------------------
# 2. Kernel modules and sysctl networking prerequisites
# ---------------------------------------------------------------------------
- name: Persist required Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Check if required Kubernetes kernel modules are loaded
  ansible.builtin.stat:
    path: "/sys/module/{{ item }}"
  loop:
    - overlay
    - br_netfilter
  register: _kubernetes_loaded_modules

- name: Load missing Kubernetes kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item.item }}"
  loop: "{{ _kubernetes_loaded_modules.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  changed_when: true

- name: Configure Kubernetes sysctl networking parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: Apply sysctl settings

# ---------------------------------------------------------------------------
# 3. Container runtime (containerd with CRI enabled and SystemdCgroup = true)
# ---------------------------------------------------------------------------
- name: Check if containerd binary is already installed
  ansible.builtin.stat:
    path: /usr/bin/containerd
  register: _kubernetes_containerd_bin

- name: Install containerd if not already present (e.g. standalone run without Docker role)
  ansible.builtin.package:
    name: "{{ kubernetes_containerd_package_by_family[ansible_facts['os_family']] }}"
    state: present
  when: not _kubernetes_containerd_bin.stat.exists

- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check existing /etc/containerd/config.toml
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: _kubernetes_containerd_conf_stat

- name: Read existing /etc/containerd/config.toml if present
  ansible.builtin.slurp:
    path: /etc/containerd/config.toml
  register: _kubernetes_containerd_conf_raw
  when: _kubernetes_containerd_conf_stat.stat.exists

- name: Determine whether containerd config needs regeneration
  ansible.builtin.set_fact:
    _kubernetes_containerd_conf_text: >-
      {{
        (_kubernetes_containerd_conf_raw.content | b64decode)
        if (_kubernetes_containerd_conf_stat.stat.exists and _kubernetes_containerd_conf_raw.content is defined)
        else ''
      }}

- name: Generate default containerd configuration with CRI plugin enabled
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
  when: >-
    (not _kubernetes_containerd_conf_stat.stat.exists)
    or (_kubernetes_containerd_conf_text is regex('(?m)^\s*disabled_plugins\s*=.*["\x27]cri["\x27]'))
    or ('SystemdCgroup' not in _kubernetes_containerd_conf_text)
  changed_when: true
  notify: Restart containerd

- name: Enable SystemdCgroup in /etc/containerd/config.toml
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false\b'
    replace: '\1true'
  when: (not ansible_check_mode) or _kubernetes_containerd_conf_stat.stat.exists
  notify: Restart containerd

- name: Ensure containerd service is enabled and running
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started
  when: (not ansible_check_mode) or _kubernetes_containerd_bin.stat.exists

# ---------------------------------------------------------------------------
# 4. Install Kubernetes packages (Debian, RedHat, SUSE)
# ---------------------------------------------------------------------------
- name: Install Kubernetes packages on Debian family
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Kubernetes packages on RedHat family
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Kubernetes packages on SUSE family
  ansible.builtin.include_tasks: suse.yml
  when: ansible_facts['os_family'] == 'Suse'

- name: Enable kubelet service
  ansible.builtin.service:
    name: kubelet
    enabled: true
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# 5. Detect libvirt default virtual NIC (e.g. virbr0) or fall back to vanilla
# ---------------------------------------------------------------------------
- name: Check if libvirt (virsh) is installed
  ansible.builtin.stat:
    path: /usr/bin/virsh
  register: _kubernetes_virsh_bin

- name: Query libvirt default network for its virtual bridge NIC
  ansible.builtin.command:
    cmd: "virsh net-info {{ kubernetes_libvirt_network_name }}"
  register: _kubernetes_libvirt_net_info
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - kubernetes_bind_libvirt_nic | bool
    - _kubernetes_virsh_bin.stat.exists

- name: Start libvirt default network if installed but inactive
  ansible.builtin.command:
    cmd: "virsh net-start {{ kubernetes_libvirt_network_name }}"
  when:
    - kubernetes_bind_libvirt_nic | bool
    - kubernetes_libvirt_autostart_network | bool
    - _kubernetes_virsh_bin.stat.exists
    - _kubernetes_libvirt_net_info.rc | default(1) == 0
    - _kubernetes_libvirt_net_info.stdout is regex('Active:\s+no')
  changed_when: true

- name: Refresh network facts after libvirt inspection
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - network

- name: Determine detected libvirt bridge interface name
  ansible.builtin.set_fact:
    _kubernetes_libvirt_bridge_candidates: >-
      {{
        (
          _kubernetes_libvirt_net_info.stdout
          | default('')
          | regex_search('(?m)^Bridge:\s+(\S+)', '\1')
        )
        | default([], true)
      }}

- name: Select candidate libvirt virtual NIC
  ansible.builtin.set_fact:
    _kubernetes_detected_libvirt_nic: >-
      {{
        (_kubernetes_libvirt_bridge_candidates | first)
        if (_kubernetes_libvirt_bridge_candidates | length > 0 and (_kubernetes_libvirt_bridge_candidates | first) not in ['', '-'])
        else (
          network.name
          if (network is defined and network.name is defined and (network.name in ansible_facts))
          else ''
        )
      }}

- name: Decide whether to bind Kubernetes to libvirt virtual NIC
  ansible.builtin.set_fact:
    _kubernetes_use_libvirt_nic: >-
      {{
        (kubernetes_bind_libvirt_nic | bool)
        and (_kubernetes_virsh_bin.stat.exists | bool)
        and (_kubernetes_detected_libvirt_nic | length > 0)
        and (_kubernetes_detected_libvirt_nic in ansible_facts)
        and (ansible_facts[_kubernetes_detected_libvirt_nic]['ipv4']['address'] is defined)
      }}

- name: Set Kubernetes bind address and CIDR from libvirt virtual NIC
  ansible.builtin.set_fact:
    _kubernetes_target_interface: "{{ _kubernetes_detected_libvirt_nic }}"
    _kubernetes_bind_address: "{{ ansible_facts[_kubernetes_detected_libvirt_nic]['ipv4']['address'] }}"
    _kubernetes_allowed_cidr: >-
      {{
        ansible_facts[_kubernetes_detected_libvirt_nic]['ipv4']['network']
        ~ '/'
        ~ ansible_facts[_kubernetes_detected_libvirt_nic]['ipv4']['prefix']
      }}
  when: _kubernetes_use_libvirt_nic | bool

- name: Use vanilla kubeadm networking when libvirt virtual NIC is absent
  ansible.builtin.set_fact:
    _kubernetes_target_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('') }}"
    _kubernetes_bind_address: ""
    _kubernetes_allowed_cidr: >-
      {{
        (ansible_facts['default_ipv4']['network'] ~ '/' ~ ansible_facts['default_ipv4']['prefix'])
        if (ansible_facts['default_ipv4']['network'] is defined and ansible_facts['default_ipv4']['prefix'] is defined)
        else ''
      }}
  when: not (_kubernetes_use_libvirt_nic | bool)

- name: Report selected Kubernetes installation networking mode
  ansible.builtin.debug:
    msg: >-
      {{
        'Libvirt detected: binding Kubernetes control plane and kubelet to '
        ~ _kubernetes_target_interface ~ ' (' ~ _kubernetes_bind_address ~ ', CIDR ' ~ _kubernetes_allowed_cidr ~ ').'
        if (_kubernetes_use_libvirt_nic | bool)
        else 'Libvirt virtual NIC not detected: performing vanilla kubeadm installation.'
      }}

# ---------------------------------------------------------------------------
# 6. Order kubelet after libvirt on boot when bound to a libvirt NIC
# ---------------------------------------------------------------------------
- name: Configure kubelet systemd drop-in to wait for libvirt virtual NIC on boot
  when: _kubernetes_use_libvirt_nic | bool
  block:
    - name: Ensure kubelet systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install systemd drop-in waiting for libvirt virtual NIC IP
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/20-wait-libvirt-nic.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          After=network-online.target libvirtd.service virtnetworkd.service
          Wants=network-online.target

          [Service]
          ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do ip -4 addr show dev {{ _kubernetes_target_interface }} 2>/dev/null | grep -q "{{ _kubernetes_bind_address }}/" && exit 0; sleep 1; done; exit 0'
      notify: Reload systemd daemon

- name: Remove libvirt NIC kubelet drop-in when using vanilla installation
  ansible.builtin.file:
    path: /etc/systemd/system/kubelet.service.d/20-wait-libvirt-nic.conf
    state: absent
  when: not (_kubernetes_use_libvirt_nic | bool)
  notify: Reload systemd daemon

# ---------------------------------------------------------------------------
# 7. Firewall rules (UFW on Debian, firewalld on RedHat / SUSE)
# ---------------------------------------------------------------------------
- name: Check if UFW is installed (Debian)
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: _kubernetes_ufw_bin
  when:
    - kubernetes_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Open Kubernetes control-plane ports in UFW on libvirt NIC (Debian)
  ansible.builtin.command:
    cmd: >-
      ufw allow in on {{ _kubernetes_target_interface }}
      from {{ _kubernetes_allowed_cidr }}
      to any port {{ item }}
      proto tcp
      comment 'HomeLab Kubernetes'
  loop: "{{ kubernetes_firewall_tcp_ports }}"
  register: _kubernetes_ufw_libvirt_rules
  changed_when: >-
    'Rule added' in _kubernetes_ufw_libvirt_rules.stdout
    or 'Rules updated' in _kubernetes_ufw_libvirt_rules.stdout
  when:
    - kubernetes_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'
    - _kubernetes_ufw_bin.stat.exists | default(false)
    - _kubernetes_use_libvirt_nic | bool

- name: Open Kubernetes control-plane ports in UFW for vanilla installation (Debian)
  ansible.builtin.command:
    cmd: >-
      ufw allow {{ item }}/tcp
      comment 'HomeLab Kubernetes'
  loop: "{{ kubernetes_firewall_tcp_ports }}"
  register: _kubernetes_ufw_vanilla_rules
  changed_when: >-
    'Rule added' in _kubernetes_ufw_vanilla_rules.stdout
    or 'Rules updated' in _kubernetes_ufw_vanilla_rules.stdout
  when:
    - kubernetes_configure_firewall | bool
    - ansible_facts['os_family'] == 'Debian'
    - _kubernetes_ufw_bin.stat.exists | default(false)
    - not (_kubernetes_use_libvirt_nic | bool)

- name: Gather systemd service facts to detect firewalld
  ansible.builtin.service_facts:

- name: Open Kubernetes control-plane ports in firewalld (RedHat / SUSE)
  when:
    - kubernetes_configure_firewall | bool
    - ansible_facts['os_family'] in ['RedHat', 'Suse']
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
  block:
    - name: Detect firewalld zone for {{ _kubernetes_target_interface }}
      ansible.builtin.command:
        cmd: "firewall-cmd --get-zone-of-interface={{ _kubernetes_target_interface }}"
      register: _kubernetes_firewalld_iface_zone
      changed_when: false
      failed_when: false
      check_mode: false
      when: _kubernetes_target_interface | length > 0

    - name: Detect default firewalld zone if interface is unassigned
      ansible.builtin.command:
        cmd: firewall-cmd --get-default-zone
      register: _kubernetes_firewalld_default_zone
      changed_when: false
      check_mode: false
      when: (_kubernetes_target_interface | length == 0) or (_kubernetes_firewalld_iface_zone.rc | default(1) != 0)

    - name: Set target firewalld zone
      ansible.builtin.set_fact:
        _kubernetes_firewalld_zone: >-
          {{
            (_kubernetes_firewalld_iface_zone.stdout | trim)
            if (_kubernetes_target_interface | length > 0 and _kubernetes_firewalld_iface_zone.rc | default(1) == 0)
            else (_kubernetes_firewalld_default_zone.stdout | trim)
          }}

    - name: Check Kubernetes ports in firewalld zone
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone={{ _kubernetes_firewalld_zone }} --query-port={{ item | replace(':', '-') }}/tcp"
      loop: "{{ kubernetes_firewall_tcp_ports }}"
      register: _kubernetes_firewalld_queries
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Allow Kubernetes ports in firewalld zone
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone={{ _kubernetes_firewalld_zone }} --add-port={{ item.item | replace(':', '-') }}/tcp"
      loop: "{{ _kubernetes_firewalld_queries.results }}"
      loop_control:
        label: "{{ item.item | replace(':', '-') }}/tcp"
      when: item.rc != 0
      changed_when: true
      register: _kubernetes_firewalld_added

    - name: Reload firewalld to apply Kubernetes rules
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: _kubernetes_firewalld_added is changed
      changed_when: true

# ---------------------------------------------------------------------------
# 8. Render kubeadm configuration and initialize the control plane
# ---------------------------------------------------------------------------
- name: Flush handlers before initializing Kubernetes control plane
  ansible.builtin.meta: flush_handlers

- name: Ensure /etc/kubernetes directory exists
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render kubeadm configuration file
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Check if Kubernetes control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: _kubernetes_admin_conf

- name: Initialize Kubernetes control plane with kubeadm
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when:
    - not _kubernetes_admin_conf.stat.exists
    - not ansible_check_mode
  register: _kubernetes_kubeadm_init
  changed_when: true

# ---------------------------------------------------------------------------
# 9. Configure user kubeconfig and allow pods on control-plane node
# ---------------------------------------------------------------------------
- name: Re-check /etc/kubernetes/admin.conf after initialization
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: _kubernetes_admin_conf_after

- name: Configure kubectl kubeconfig for target user
  when:
    - kubernetes_configure_user_kubeconfig | bool
    - kubernetes_user | default('') | length > 0
    - _kubernetes_admin_conf_after.stat.exists
  block:
    - name: Look up target user passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ kubernetes_user }}"

    - name: Determine target user home directory and primary group
      ansible.builtin.set_fact:
        _kubernetes_user_home: "{{ ansible_facts.getent_passwd[kubernetes_user][4] }}"
        _kubernetes_user_gid: "{{ ansible_facts.getent_passwd[kubernetes_user][2] }}"

    - name: Ensure user .kube directory exists
      ansible.builtin.file:
        path: "{{ _kubernetes_user_home }}/.kube"
        state: directory
        owner: "{{ kubernetes_user }}"
        group: "{{ _kubernetes_user_gid }}"
        mode: "0700"

    - name: Copy admin.conf to target user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ _kubernetes_user_home }}/.kube/config"
        remote_src: true
        owner: "{{ kubernetes_user }}"
        group: "{{ _kubernetes_user_gid }}"
        mode: "0600"

- name: Ensure control-plane node accepts host/workload pods (untainted)
  when:
    - kubernetes_allow_control_plane_scheduling | bool
    - _kubernetes_admin_conf_after.stat.exists
    - not ansible_check_mode
  block:
    - name: Inspect control-plane node taints
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
          -l node-role.kubernetes.io/control-plane
          -o jsonpath='{range .items[*]}{.metadata.name}:{range .spec.taints[*]}{.key}={.effect},{end}{"\n"}{end}'
      register: _kubernetes_cp_taints
      retries: 12
      delay: 5
      until: _kubernetes_cp_taints.rc == 0
      changed_when: false

    - name: Remove control-plane NoSchedule taint if present
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes
          -l node-role.kubernetes.io/control-plane
          node-role.kubernetes.io/control-plane:NoSchedule-
      when: "'node-role.kubernetes.io/control-plane=NoSchedule' in _kubernetes_cp_taints.stdout"
      changed_when: true

    - name: Remove legacy master NoSchedule taint if present
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes
          -l node-role.kubernetes.io/control-plane
          node-role.kubernetes.io/master:NoSchedule-
      when: "'node-role.kubernetes.io/master=NoSchedule' in _kubernetes_cp_taints.stdout"
      changed_when: true

- name: Report Kubernetes setup summary
  ansible.builtin.debug:
    msg: >-
      Kubernetes ({{ kubernetes_minor_version }}) control plane is configured
      {{ 'and bound to ' ~ _kubernetes_target_interface ~ ' (' ~ _kubernetes_bind_address ~ ')' if (_kubernetes_use_libvirt_nic | bool) else '(vanilla install)' }}.
      Control-plane pod scheduling is enabled.
      Install a CNI plugin (configured podSubnet: {{ kubernetes_pod_network_cidr }}) for the node to become Ready.
  when: _kubernetes_kubeadm_init is changed
