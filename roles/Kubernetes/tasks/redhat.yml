---
- name: Configure SELinux to permissive mode for Kubernetes on RedHat family
  when: kubernetes_configure_selinux | bool
  block:
    - name: Check if SELinux configuration file exists
      ansible.builtin.stat:
        path: /etc/selinux/config
      register: _kubernetes_selinux_conf

    - name: Set SELinux to permissive in /etc/selinux/config
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing$'
        replace: 'SELINUX=permissive'
      when: _kubernetes_selinux_conf.stat.exists

    - name: Check current SELinux runtime mode
      ansible.builtin.command:
        cmd: getenforce
      register: _kubernetes_selinux_mode
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Switch SELinux runtime mode to permissive
      ansible.builtin.command:
        cmd: setenforce 0
      when:
        - _kubernetes_selinux_mode.rc == 0
        - (_kubernetes_selinux_mode.stdout | trim | lower) == 'enforcing'
      changed_when: true

- name: Install Kubernetes prerequisite packages on RedHat family
  ansible.builtin.dnf:
    name:
      - iproute-tc
      - conntrack-tools
      - socat
      - ethtool
      - ca-certificates
      - curl
    state: present

- name: Import Kubernetes official RPM GPG key
  ansible.builtin.rpm_key:
    key: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/rpm/repodata/repomd.xml.key"
    state: present

- name: Add Kubernetes official YUM/DNF repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: "Kubernetes {{ kubernetes_minor_version }}"
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/rpm/repodata/repomd.xml.key"
    exclude: "kubelet kubeadm kubectl cri-tools kubernetes-cni"
    state: present

- name: Install kubelet, kubeadm, and kubectl on RedHat family
  ansible.builtin.dnf:
    name: "{{ kubernetes_packages }}"
    disable_excludes: kubernetes
    state: present
