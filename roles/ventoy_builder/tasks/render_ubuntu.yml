---
- name: Check if user avatar file exists
  ansible.builtin.stat:
    path: "{{ user_avatar_file }}"
  register: user_avatar_stat
  when: user_avatar_file | default('') | length > 0

- name: Read and base64-encode user avatar
  ansible.builtin.slurp:
    src: "{{ user_avatar_file }}"
  register: user_avatar_slurp
  when:
    - user_avatar_file | default('') | length > 0
    - user_avatar_stat.stat.exists | default(false)

- name: Check if Bluetooth archive exists
  ansible.builtin.stat:
    path: "{{ bluetooth_archive_file }}"
  register: bluetooth_archive_stat
  when: bluetooth_archive_file | default('') | length > 0

- name: Read and base64-encode Bluetooth pairing archive
  ansible.builtin.slurp:
    src: "{{ bluetooth_archive_file }}"
  register: bluetooth_archive_slurp
  when:
    - bluetooth_archive_file | default('') | length > 0
    - bluetooth_archive_stat.stat.exists | default(false)

- name: Render Ubuntu autoinstall user-data
  ansible.builtin.template:
    src: ubuntu/user-data.j2
    dest: "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/user-data"
    mode: "0600"

- name: Copy user-data as autoinstall.yaml for Ventoy auto_install plugin
  ansible.builtin.copy:
    src: "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/user-data"
    dest: "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/autoinstall.yaml"
    mode: "0600"

- name: Render cloud-init meta-data
  ansible.builtin.template:
    src: ubuntu/meta-data.j2
    dest: "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/meta-data"
    mode: "0644"

- name: Build FAT32 cidata seed image (user-data + meta-data)
  ansible.builtin.shell: |
    set -euo pipefail
    IMG="{{ ventoy_stage_dir }}/cidata.img"
    rm -f "$IMG"
    truncate -s "{{ cidata_image_size }}" "$IMG"
    mkfs.vfat -n cidata "$IMG" >/dev/null
    mcopy -oi "$IMG" \
      "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/user-data" \
      "{{ ventoy_stage_dir }}/autoinstall/{{ target_distro }}/meta-data" \
      ::
  args:
    executable: /bin/bash
  changed_when: true
