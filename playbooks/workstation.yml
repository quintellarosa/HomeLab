---
# Post-install notebook reconfiguration (Debian, RedHat & SUSE families)
- name: Configure HomeLab personal notebook
  hosts: localhost
  become: true
  gather_facts: true
  vars_files:
    - ../vault/vault.yml

  pre_tasks:
    - name: Verify OS family is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
        fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}'. Supported families: Debian, RedHat, Suse."

  roles:
    - NetworkValidation
    #- Bluetooth
    - EssentialTools
    - UbuntuGnomeCustomization
    - GoogleChrome
    - GoogleAntigravityIDE
    - Thunderbird
    - InSync
    - Virtualization
    - PostgreSQL
    - Docker
    - K8sMasterInstall
    - K8sCNICilium
    - K8sMetalLB
    - K8sCertManager
    - SplitDNS
    - K8sStorageClass
    - AWXOperator
    - AWX
