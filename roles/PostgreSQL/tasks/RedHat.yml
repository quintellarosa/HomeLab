---
- name: Install PostgreSQL server
  ansible.builtin.dnf:
    name: postgresql-server
    state: present

- name: Initialize the PostgreSQL database if needed
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION

- name: Set PostgreSQL configuration file paths
  ansible.builtin.set_fact:
    postgresql_config_files:
      - /var/lib/pgsql/data/postgresql.conf
    postgresql_hba_files:
      - /var/lib/pgsql/data/pg_hba.conf

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow PostgreSQL from configured client networks in firewalld
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ item }}"
      port port="{{ postgresql.port }}" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ postgresql_allowed_networks }}"
