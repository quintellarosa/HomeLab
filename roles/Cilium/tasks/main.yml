---
- name: Validate Cilium CLI architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: "The Cilium CLI role supports only x86_64 and aarch64."

- name: Check whether Cilium CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/cilium
  register: cilium_cli_binary

- name: Read installed Cilium CLI version
  ansible.builtin.command:
    cmd: /usr/local/bin/cilium version --client
  register: cilium_cli_installed_version
  changed_when: false
  when: cilium_cli_binary.stat.exists

- name: Download verified Cilium CLI archive
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cilium_architecture_aliases[ansible_facts['architecture']] }}.tar.gz"
    dest: "/var/tmp/cilium-cli-{{ cilium_cli_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
    checksum: "{{ cilium_cli_archive_checksums[ansible_facts['architecture']] }}"
    mode: '0644'
  when: >-
    not cilium_cli_binary.stat.exists or
    cilium_cli_version not in (cilium_cli_installed_version.stdout | default(''))

- name: Install Cilium CLI
  ansible.builtin.unarchive:
    src: "/var/tmp/cilium-cli-{{ cilium_cli_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
  when: >-
    not cilium_cli_binary.stat.exists or
    cilium_cli_version not in (cilium_cli_installed_version.stdout | default(''))

- name: Remove downloaded Cilium CLI archive
  ansible.builtin.file:
    path: "/var/tmp/cilium-cli-{{ cilium_cli_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
    state: absent
  when: >-
    not cilium_cli_binary.stat.exists or
    cilium_cli_version not in (cilium_cli_installed_version.stdout | default(''))

- name: Check if Cilium is already installed in the cluster
  ansible.builtin.command:
    cmd: kubectl -n kube-system get daemonset cilium
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_ds
  failed_when: cilium_ds.rc != 0 and 'NotFound' not in cilium_ds.stderr
  changed_when: false

- name: Install Cilium CNI into Kubernetes cluster
  ansible.builtin.command:
    cmd: >
      cilium install
      --set ipam.operator.clusterPoolIPv4PodCIDRList={{ cilium_pod_network_cidr }}
      --set ipv4NativeRoutingCIDR={{ cilium_pod_network_cidr }}
      --set operator.replicas=1
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: cilium_ds.rc != 0

- name: Wait for Cilium CNI to become ready
  ansible.builtin.command:
    cmd: cilium status --wait
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

