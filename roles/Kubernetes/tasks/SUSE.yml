---
- name: Install firewalld for Kubernetes on SUSE systems
  ansible.builtin.zypper:
    name: firewalld
    state: present

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow Kubernetes and Cilium ports in firewalld
  ansible.posix.firewalld:
    zone: public
    port: "{{ item.port }}/{{ item.protocol }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ kubernetes.firewall_ports }}"

- name: Enable masquerading for Kubernetes pods
  ansible.posix.firewalld:
    zone: public
    masquerade: true
    permanent: true
    immediate: true
    state: enabled

- name: Trust Cilium interfaces in firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - cilium_host
    - cilium_net
    - cilium_vxlan
    - lxc+

- name: Add Kubernetes package repository
  community.general.zypper_repository:
    name: kubernetes
    repo: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes.version }}/rpm/"
    enabled: true
    auto_import_keys: true
    state: present

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.zypper:
    name:
      - containerd
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true
