all:
  vars:
    network:
      name: "virbr0"
      domain: "quintellarosa.home"
      base: "192.168.122.0"
      prefix_length: 24
      netmask: "255.255.255.0"
      gateway: "192.168.122.1"
      dns:
        primary: "192.168.122.2"
        secondary: "8.8.8.8"
      ranges:
        static:
          start: "192.168.122.2"
          end: "192.168.122.100"
        dhcp:
          start: "192.168.122.101"
          end: "192.168.122.200"
        metallb:
          start: "192.168.122.240"
          end: "192.168.122.250"
    postgresql:
      host: "{{ network.gateway }}"
      port: 5432
      sslmode: "prefer"
      databases:
        awx:
          name: "awx"
          user: "awx"
  hosts:
    localhost:
      ansible_connection: local
      # Ubuntu 26.04 defaults /usr/bin/sudo to sudo-rs; use sudo.ws when present, standard sudo on RedHat/other distros.
      ansible_become_exe: "{{ 'sudo.ws' if (lookup('ansible.builtin.fileglob', '/usr/bin/sudo.ws') | length > 0) else 'sudo' }}"
  children:
    DmnCtl:
      vars:
        ansible_connection: ssh
        ansible_shell_type: powershell
        ansible_user: Administrator
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      hosts:
        LclWinLabDomCtl:
          ansible_host: "{{ network.dns.primary }}"
