---
- name: Check if PostgreSQL data directory is initialized (RedHat)
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: _postgresql_redhat_pg_version

- name: Initialize PostgreSQL database cluster (RedHat)
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: not _postgresql_redhat_pg_version.stat.exists

- name: Set PostgreSQL configuration directory (RedHat)
  ansible.builtin.set_fact:
    _postgresql_conf_dir: /var/lib/pgsql/data
    _postgresql_systemd_unit_dropin_dirs:
      - /etc/systemd/system/postgresql.service.d
