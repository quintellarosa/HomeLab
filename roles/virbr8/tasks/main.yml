---
- name: Install libvirt Python dependencies
  ansible.builtin.package:
    name: "{{ libvirt_python_packages[ansible_facts['os_family']] }}"
    state: present

- name: Define {{ bridge.name }} libvirt network
  community.libvirt.virt_net:
    name: "{{ bridge.name }}"
    state: present
    xml: |
      <network>
        <name>{{ bridge.name }}</name>
        <forward mode='nat'/>
        <bridge name='{{ bridge.name }}' stp='on' delay='0'/>
        <ip address='{{ bridge.ip }}' netmask='{{ bridge.netmask }}'>
          <dhcp>
            <range start='{{ bridge.dhcp.start }}' end='{{ bridge.dhcp.end }}'/>
          </dhcp>
        </ip>
      </network>

- name: Ensure {{ bridge.name }} is active
  community.libvirt.virt_net:
    name: "{{ bridge.name }}"
    state: active

- name: Ensure {{ bridge.name }} is set to autostart
  community.libvirt.virt_net:
    name: "{{ bridge.name }}"
    autostart: true
