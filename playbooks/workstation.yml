---
# Post-install notebook reconfiguration (Debian & RedHat families)
- name: Configure HomeLab personal notebook
  hosts: localhost
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify OS family is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat']
        fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}'. Supported families: Debian, RedHat."

  roles:
    - EssentialTools
    - UserAvatar
    - Bluetooth
    - GoogleChrome
    - GoogleAntigravityIDE
