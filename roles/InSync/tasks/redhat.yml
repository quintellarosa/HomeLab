---
- name: Determine Insync RedHat-family repository path
  ansible.builtin.set_fact:
    _insync_redhat_distro: >-
      {{
        'fedora' if ansible_facts['distribution'] == 'Fedora'
        else ('rhel' if ansible_facts['distribution'] == 'RedHat' else 'centos')
      }}

- name: Import Insync RPM GPG key
  ansible.builtin.rpm_key:
    key: "{{ insync_rpm_gpg_key_url }}"
    state: present

- name: Add Insync YUM/DNF repository
  ansible.builtin.yum_repository:
    name: insync
    description: Insync repository
    baseurl: "https://yum.insync.io/{{ _insync_redhat_distro }}/$releasever/"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ insync_rpm_gpg_key_url }}"
    metadata_expire: 120m
    state: present
