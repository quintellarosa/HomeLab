---
- name: Disable systemd-zram-generator on Fedora (if present)
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    mode: '0644'
    content: ""

- name: Configure firewalld for Kubernetes and Cilium
  block:
    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Allow Kubernetes and Cilium ports in libvirt zone
      ansible.posix.firewalld:
        zone: libvirt
        port: "{{ item.port }}/{{ item.protocol }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ k8s_firewall_ports }}"

    - name: Enable masquerading on default zone so pods can reach the internet
      ansible.posix.firewalld:
        masquerade: true
        permanent: true
        immediate: true
        state: enabled

    - name: Trust Cilium interfaces in firewalld
      ansible.posix.firewalld:
        zone: trusted
        interface: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - cilium_host
        - cilium_net
        - cilium_vxlan
        - lxc+

- name: Add Kubernetes repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/kubernetes.repo
    mode: '0644'
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    disable_excludes: kubernetes
    state: present
    update_cache: true
