---
- name: Disable systemd-zram-generator on Fedora (if present)
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    mode: '0644'
    content: ""

- name: Configure firewalld for Kubernetes and Cilium
  block:
    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Allow Kubernetes and Cilium ports in the public zone
      ansible.posix.firewalld:
        zone: public
        port: "{{ item.port }}/{{ item.protocol }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ kubernetes.firewall_ports }}"

    - name: Enable masquerading on the public zone so pods can reach the internet
      ansible.posix.firewalld:
        zone: public
        masquerade: true
        permanent: true
        immediate: true
        state: enabled

    - name: Trust Cilium interfaces in firewalld
      ansible.posix.firewalld:
        zone: trusted
        interface: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - cilium_host
        - cilium_net
        - cilium_vxlan
        - lxc+

- name: Add Kubernetes repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/kubernetes.repo
    mode: '0644'
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/{{ kubernetes.version }}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/{{ kubernetes.version }}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Add official Docker repository for containerd.io
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: >-
      https://download.docker.com/linux/{{
        'fedora' if ansible_facts['distribution'] == 'Fedora'
        else 'centos' if ansible_facts['distribution'] in ['CentOS', 'Rocky', 'AlmaLinux']
        else 'rhel'
      }}/$releasever/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: >-
      https://download.docker.com/linux/{{
        'fedora' if ansible_facts['distribution'] == 'Fedora'
        else 'centos' if ansible_facts['distribution'] in ['CentOS', 'Rocky', 'AlmaLinux']
        else 'rhel'
      }}/gpg

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.dnf:
    name:
      - containerd.io
      - kubelet
      - kubeadm
      - kubectl
    disable_excludes: kubernetes
    state: present
    update_cache: true
