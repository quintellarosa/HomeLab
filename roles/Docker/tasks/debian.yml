---
- name: Determine Docker Debian-family distribution and architecture
  ansible.builtin.set_fact:
    _docker_debian_distro: "{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"
    _docker_debian_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'amd64': 'amd64',
          'aarch64': 'arm64',
          'arm64': 'arm64',
        }[ansible_facts['architecture']] | default(ansible_facts['architecture'])
      }}

- name: Remove conflicting unofficial Docker packages on Debian family
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker official APT signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ _docker_debian_distro }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  register: _docker_gpg_key

- name: Remove legacy docker.list repository file if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker official DEB822 repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ _docker_debian_distro }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ _docker_debian_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: _docker_deb_repo

- name: Update APT cache after configuring Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: _docker_deb_repo.changed or _docker_gpg_key.changed
