---
# Post-install Dell Precision 7550 configuration (Debian, RedHat & SUSE families)
- name: Configure Dell Precision 7550
  hosts: DellPrecision7550
  become: true
  gather_facts: true
  vars_files:
    - ../vault/vault.yml

  pre_tasks:
    - name: Verify OS family is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
        fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}'. Supported families: Debian, RedHat, Suse."

  roles:
    - NetworkValidation
    - Bluetooth
    - EssentialTools
    - UbuntuGnomeCustomization
    - GoogleChrome
    - GoogleAntigravityIDE
    - Thunderbird
    - InSync
    - KVM
    # - Docker
    # - PostgreSQL
    # - K8sMasterInstall
    # - K8sCNICilium
    # - K8sMetalLB
    # - K8sCertManager
    # - K8sStorageClass
    # - SplitDNS
    # - AWXOperator
    # - AWX
    # - GitLabCEOmnibus
    # - Keycloak
    # - Backstage
    # - ArgoCD
