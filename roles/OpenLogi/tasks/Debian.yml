---
- name: Download OpenLogi Debian package
  ansible.builtin.get_url:
    url: "{{ openlogi.debian_package_url }}"
    dest: "/var/tmp/openlogi_{{ openlogi.version }}_amd64.deb"
    mode: '0644'
  register: openlogi_debian_package

- name: Install OpenLogi Debian package
  ansible.builtin.apt:
    deb: "{{ openlogi_debian_package.dest }}"
    state: present
