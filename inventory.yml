all:
  vars:
    network:
      name: "virbr0"
      domain: "quintellarosa.home"
      base: "192.168.122.0"
      prefix_length: 24
      netmask: "255.255.255.0"
      gateway: "192.168.122.1"
      dns:
        primary: "192.168.122.2"
        secondary: "8.8.8.8"
      ranges:
        static:
          start: "192.168.122.2"
          end: "192.168.122.100"
        dhcp:
          start: "192.168.122.101"
          end: "192.168.122.200"
        metallb:
          start: "192.168.122.240"
          end: "192.168.122.250"
    postgresql:
      awx:
        host: "{{ network.gateway }}"
        port: 5432
        sslmode: "prefer"
        database: "awx"
        user: "awx"
      gitlab:
        host: "{{ network.gateway }}"
        port: 5432
        sslmode: "prefer"
        database: "gitlabhq_production"
        user: "gitlab"
      backstage:
        host: "{{ network.gateway }}"
        port: 5432
        sslmode: "prefer"
        database: "backstage"
        user: "backstage"
      keycloak:
        host: "{{ network.gateway }}"
        port: 5432
        sslmode: "prefer"
        database: "keycloak"
        user: "keycloak"
  children:
    PersonalComputers:
      hosts:
        DellPrecision7550:
          ansible_connection: local
          # Ubuntu 26.04 defaults /usr/bin/sudo to sudo-rs; use sudo.ws when present, standard sudo on RedHat/other distros.
          ansible_become_exe: "{{ 'sudo.ws' if (lookup('ansible.builtin.fileglob', '/usr/bin/sudo.ws') | length > 0) else 'sudo' }}"
    DomainControllers:
      vars:
        ansible_connection: ssh
        ansible_shell_type: powershell
        ansible_user: Administrator
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      hosts:
        LclWinLabDomCtl:
          ansible_host: "{{ network.dns.primary }}"
