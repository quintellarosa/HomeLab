---
- name: Configure UFW for Kubernetes and Cilium
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow Kubernetes and Cilium ports in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port | replace('-', ':') }}"
        proto: "{{ item.protocol }}"
      loop: "{{ kubernetes.firewall_ports }}"

    - name: Allow forwarded packets in UFW for pod internet access
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install APT repository module dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes.version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'

- name: Add Kubernetes repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes.version }}/deb/"
    suites: /
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: present

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.apt:
    name:
      - containerd
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true
