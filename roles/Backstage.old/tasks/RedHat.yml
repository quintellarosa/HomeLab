---
- name: Install Backstage RedHat dependencies
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - git
      - gcc-c++
      - make
      - python3
      - python3-psycopg2
      - firewalld
    state: present

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow Backstage frontend and backend ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ backstage.frontend.port }}"
    - "{{ backstage.backend.port }}"
