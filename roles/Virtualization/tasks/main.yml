---
- name: Validate virtualization platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat", "Suse"]
    fail_msg: "Virtualization setup is supported only on Debian, RedHat, and SUSE systems."

- name: Detect whether this system is a virtual machine guest
  ansible.builtin.set_fact:
    virtualization_is_guest: "{{ (ansible_facts['ansible_virtualization_role'] | default('unknown')) == 'guest' }}"

- name: Set IOMMU parameter based on CPU vendor
  ansible.builtin.set_fact:
    iommu_vendor_arg: "{{ 'intel_iommu' if 'GenuineIntel' in ansible_facts['processor'] else 'amd_iommu' }}"

- name: Explain IOMMU configuration is skipped for a guest
  ansible.builtin.debug:
    msg: "Skipping IOMMU boot-parameter changes inside a guest VM; virtualization and network setup will continue."
  when: virtualization_is_guest

- name: Configure virtualization for Debian-family systems
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Configure virtualization for RedHat-family systems
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Configure virtualization for SUSE-family systems
  ansible.builtin.include_tasks: SUSE.yml
  when: ansible_facts['os_family'] == "Suse"

- name: Ensure libvirtd service is enabled and running
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true

- name: Add user to libvirt group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: libvirt
    append: true
