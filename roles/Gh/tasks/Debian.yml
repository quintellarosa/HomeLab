---
- name: Validate GitHub CLI repository architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in gh_apt_architectures
    fail_msg: "The GitHub CLI APT repository does not support this architecture."

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install APT repository module dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Download GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Add GitHub CLI repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: "{{ gh_apt_architectures[ansible_facts['architecture']] }}"
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present
