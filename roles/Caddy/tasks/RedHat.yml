---
- name: Remove stale Caddy RPM repository configuration
  ansible.builtin.file:
    path: /etc/yum.repos.d/caddy-stable.repo
    state: absent

- name: Resolve Caddy binary architecture
  ansible.builtin.set_fact:
    caddy_binary_architecture: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

- name: Download Caddy standalone binary
  ansible.builtin.get_url:
    url: "https://caddyserver.com/api/download?os=linux&arch={{ caddy_binary_architecture }}"
    dest: /usr/local/bin/caddy
    mode: '0755'
    force: true

- name: Create Caddy system user
  ansible.builtin.user:
    name: caddy
    system: true
    home: /var/lib/caddy
    create_home: true
    shell: /usr/sbin/nologin
    state: present

- name: Create Caddy configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'
  loop:
    - /etc/caddy
    - /var/lib/caddy
    - /var/lib/caddy/data
    - /var/lib/caddy/config

- name: Install Caddy systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service
    mode: '0644'
    content: |
      [Unit]
      Description=Caddy
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=notify
      User=root
      Group=root
      ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile
      Restart=on-failure
      TimeoutStopSec=5
      LimitNOFILE=1048576
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      PrivateTmp=true
      ProtectSystem=full
      ProtectHome=true
      ReadWritePaths=/var/lib/caddy

      [Install]
      WantedBy=multi-user.target
