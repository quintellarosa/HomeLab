---
- name: Validate Caddy APT repository architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in caddy_apt_architectures
    fail_msg: "The Caddy APT repository does not support this architecture."

- name: Install Caddy repository prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gpg
      - python3-debian
    state: present
    update_cache: true

- name: Download Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: '0644'

- name: Add the official Caddy APT repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    architectures: "{{ caddy_apt_architectures[ansible_facts['architecture']] }}"
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    state: present

- name: Install Caddy on Debian-family systems
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
