---
- name: Ensure OS family is supported by MetalLB role
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}' for MetalLB role (supported: Debian, RedHat, Suse)."

# ---------------------------------------------------------------------------
# 1. Verify that this host is running a Kubernetes Master (control plane)
# ---------------------------------------------------------------------------
- name: Check Kubernetes master files on target host
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ metallb_kubeconfig }}"
    - "{{ metallb_apiserver_manifest }}"
  register: _metallb_master_files

- name: Check if kube-apiserver / Kubernetes master is running on this host
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ metallb_kubeconfig }}
      get nodes -l node-role.kubernetes.io/control-plane
      --no-headers
  register: _metallb_master_running_cmd
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _metallb_master_files.results[0].stat.exists
    - _metallb_master_files.results[1].stat.exists

- name: Record whether target host has a running Kubernetes Master
  ansible.builtin.set_fact:
    _metallb_has_running_master: >-
      {{
        (_metallb_master_files.results[0].stat.exists | default(false))
        and (_metallb_master_files.results[1].stat.exists | default(false))
        and (_metallb_master_running_cmd.rc | default(1) == 0)
        and ((_metallb_master_running_cmd.stdout | default('') | trim | length) > 0)
      }}

- name: Skip MetalLB role when target host does not have a running Kubernetes Master
  ansible.builtin.debug:
    msg: >-
      Skipping MetalLB role: no running Kubernetes Master (control plane) was detected on this host.
  when: not (_metallb_has_running_master | bool)

# ---------------------------------------------------------------------------
# 2. Install and configure MetalLB when a running K8s Master is detected
# ---------------------------------------------------------------------------
- name: Install and configure MetalLB on Kubernetes Master host
  when: _metallb_has_running_master | bool
  block:
    # Detect libvirt default virtual NIC dynamically (no hardcoded interface names)
    - name: Check if libvirt (virsh) is installed
      ansible.builtin.stat:
        path: /usr/bin/virsh
      register: _metallb_virsh_bin

    - name: Query libvirt default network for its virtual bridge NIC
      ansible.builtin.command:
        cmd: "virsh net-info {{ metallb_libvirt_network_name }}"
      register: _metallb_libvirt_net_info
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - metallb_bind_libvirt_nic | bool
        - _metallb_virsh_bin.stat.exists

    - name: Refresh network facts for MetalLB
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - network

    - name: Extract default libvirt bridge interface name
      ansible.builtin.set_fact:
        _metallb_libvirt_bridge_candidates: >-
          {{
            (
              _metallb_libvirt_net_info.stdout
              | default('')
              | regex_search('(?m)^Bridge:\s+(\S+)', '\1')
            )
            | default([], true)
          }}

    - name: Set detected libvirt virtual NIC for MetalLB
      ansible.builtin.set_fact:
        _metallb_detected_libvirt_nic: >-
          {{
            (_metallb_libvirt_bridge_candidates | first)
            if (_metallb_libvirt_bridge_candidates | length > 0 and (_metallb_libvirt_bridge_candidates | first) not in ['', '-'])
            else ''
          }}

    - name: Decide whether to scope MetalLB L2 and firewall to libvirt virtual NIC
      ansible.builtin.set_fact:
        _metallb_use_libvirt_nic: >-
          {{
            (metallb_bind_libvirt_nic | bool)
            and (_metallb_virsh_bin.stat.exists | bool)
            and (_metallb_detected_libvirt_nic | length > 0)
            and (_metallb_detected_libvirt_nic in ansible_facts)
            and (ansible_facts[_metallb_detected_libvirt_nic]['ipv4']['address'] is defined)
          }}

    - name: Set target interface, CIDR, and IPAddressPool range for MetalLB
      ansible.builtin.set_fact:
        _metallb_target_interface: >-
          {{
            _metallb_detected_libvirt_nic
            if (_metallb_use_libvirt_nic | bool)
            else (ansible_facts['default_ipv4']['interface'] | default(''))
          }}
        _metallb_allowed_cidr: >-
          {{
            (
              ansible_facts[_metallb_detected_libvirt_nic]['ipv4']['network']
              ~ '/'
              ~ ansible_facts[_metallb_detected_libvirt_nic]['ipv4']['prefix']
            )
            if (_metallb_use_libvirt_nic | bool)
            else ''
          }}
        _metallb_network_prefix: >-
          {{
            (
              (
                ansible_facts[_metallb_detected_libvirt_nic]['ipv4']['network']
                if (_metallb_use_libvirt_nic | bool)
                else (ansible_facts['default_ipv4']['network'] | default(''))
              ).split('.')[:3]
              | join('.')
            )
            if (
              (_metallb_use_libvirt_nic | bool)
              or (ansible_facts['default_ipv4']['network'] is defined)
            )
            else ''
          }}

    - name: Resolve MetalLB IPAddressPool addresses
      ansible.builtin.set_fact:
        _metallb_resolved_pool: >-
          {{
            metallb_address_pool
            if (metallb_address_pool | default('') | length > 0)
            else (
              _metallb_network_prefix ~ '.' ~ (metallb_pool_start_octet | string)
              ~ '-'
              ~ _metallb_network_prefix ~ '.' ~ (metallb_pool_end_octet | string)
            )
          }}

    - name: Verify MetalLB IPAddressPool range could be determined
      ansible.builtin.assert:
        that:
          - _metallb_resolved_pool | default('') | length > 0
          - not (_metallb_resolved_pool | default('')).startswith('.')
        fail_msg: >-
          Could not auto-derive a MetalLB IPAddressPool range from the host network.
          Set 'metallb_address_pool' explicitly (e.g. '192.168.122.240-192.168.122.250').

    # Firewall rules (UFW on Debian, firewalld on RedHat / SUSE)
    - name: Check if UFW is installed (Debian)
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: _metallb_ufw_bin
      when:
        - metallb_configure_firewall | bool
        - ansible_facts['os_family'] == 'Debian'

    - name: Open MetalLB speaker ports in UFW on libvirt NIC (Debian)
      ansible.builtin.command:
        cmd: >-
          ufw allow in on {{ _metallb_target_interface }}
          from {{ _metallb_allowed_cidr }}
          to any port {{ item.port }}
          proto {{ item.proto }}
          comment '{{ item.comment }}'
      loop: "{{ metallb_firewall_ports }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto }}"
      register: _metallb_ufw_libvirt_rules
      changed_when: >-
        'Rule added' in _metallb_ufw_libvirt_rules.stdout
        or 'Rules updated' in _metallb_ufw_libvirt_rules.stdout
      when:
        - metallb_configure_firewall | bool
        - ansible_facts['os_family'] == 'Debian'
        - _metallb_ufw_bin.stat.exists | default(false)
        - _metallb_use_libvirt_nic | bool

    - name: Open MetalLB speaker ports in UFW for vanilla installation (Debian)
      ansible.builtin.command:
        cmd: >-
          ufw allow {{ item.port }}/{{ item.proto }}
          comment '{{ item.comment }}'
      loop: "{{ metallb_firewall_ports }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto }}"
      register: _metallb_ufw_vanilla_rules
      changed_when: >-
        'Rule added' in _metallb_ufw_vanilla_rules.stdout
        or 'Rules updated' in _metallb_ufw_vanilla_rules.stdout
      when:
        - metallb_configure_firewall | bool
        - ansible_facts['os_family'] == 'Debian'
        - _metallb_ufw_bin.stat.exists | default(false)
        - not (_metallb_use_libvirt_nic | bool)

    - name: Gather systemd service facts to detect firewalld
      ansible.builtin.service_facts:

    - name: Open MetalLB speaker ports in firewalld (RedHat / SUSE)
      when:
        - metallb_configure_firewall | bool
        - ansible_facts['os_family'] in ['RedHat', 'Suse']
        - "'firewalld.service' in ansible_facts.services"
        - ansible_facts.services['firewalld.service'].state == 'running'
      block:
        - name: Detect firewalld zone for {{ _metallb_target_interface }}
          ansible.builtin.command:
            cmd: "firewall-cmd --get-zone-of-interface={{ _metallb_target_interface }}"
          register: _metallb_firewalld_iface_zone
          changed_when: false
          failed_when: false
          check_mode: false
          when: _metallb_target_interface | length > 0

        - name: Detect default firewalld zone if interface is unassigned
          ansible.builtin.command:
            cmd: firewall-cmd --get-default-zone
          register: _metallb_firewalld_default_zone
          changed_when: false
          check_mode: false
          when: (_metallb_target_interface | length == 0) or (_metallb_firewalld_iface_zone.rc | default(1) != 0)

        - name: Set target firewalld zone for MetalLB
          ansible.builtin.set_fact:
            _metallb_firewalld_zone: >-
              {{
                (_metallb_firewalld_iface_zone.stdout | trim)
                if (_metallb_target_interface | length > 0 and _metallb_firewalld_iface_zone.rc | default(1) == 0)
                else (_metallb_firewalld_default_zone.stdout | trim)
              }}

        - name: Check MetalLB speaker ports in firewalld zone
          ansible.builtin.command:
            cmd: "firewall-cmd --permanent --zone={{ _metallb_firewalld_zone }} --query-port={{ item.port }}/{{ item.proto }}"
          loop: "{{ metallb_firewall_ports }}"
          loop_control:
            label: "{{ item.port }}/{{ item.proto }}"
          register: _metallb_firewalld_queries
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Allow MetalLB speaker ports in firewalld zone
          ansible.builtin.command:
            cmd: "firewall-cmd --permanent --zone={{ _metallb_firewalld_zone }} --add-port={{ item.item.port }}/{{ item.item.proto }}"
          loop: "{{ _metallb_firewalld_queries.results }}"
          loop_control:
            label: "{{ item.item.port }}/{{ item.item.proto }}"
          when: item.rc != 0
          changed_when: true
          register: _metallb_firewalld_added

        - name: Reload firewalld to apply MetalLB rules
          ansible.builtin.command:
            cmd: firewall-cmd --reload
          when: _metallb_firewalld_added is changed
          changed_when: true

    # Enable kube-proxy strictARP when kube-proxy ConfigMap is present
    - name: Check kube-proxy strictARP configuration for MetalLB L2 mode
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          -n kube-system get configmap kube-proxy
          -o jsonpath='{.data.config\.conf}'
      register: _metallb_kube_proxy_cm
      changed_when: false
      failed_when: false
      check_mode: false
      when: metallb_configure_strict_arp | bool

    - name: Enable strictARP in kube-proxy ConfigMap
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }} -n kube-system get configmap kube-proxy -o yaml
          | sed -e 's/strictARP: false/strictARP: true/'
          | kubectl --kubeconfig {{ metallb_kubeconfig }} apply -f - -n kube-system
      when:
        - metallb_configure_strict_arp | bool
        - not ansible_check_mode
        - _metallb_kube_proxy_cm.rc | default(1) == 0
        - "'strictARP: false' in (_metallb_kube_proxy_cm.stdout | default(''))"
      changed_when: true
      register: _metallb_kube_proxy_patched

    - name: Restart kube-proxy DaemonSet after enabling strictARP
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          -n kube-system rollout restart daemonset/kube-proxy
      when: _metallb_kube_proxy_patched is changed
      changed_when: true

    # Download manifest, render L2 config, and apply to cluster
    - name: Download MetalLB {{ metallb_version }} native manifest
      ansible.builtin.get_url:
        url: "{{ metallb_manifest_url }}"
        dest: "{{ metallb_manifest_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Render MetalLB IPAddressPool and L2Advertisement configuration
      ansible.builtin.template:
        src: metallb-config.yaml.j2
        dest: "{{ metallb_config_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Apply MetalLB {{ metallb_version }} native manifest
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          apply -f {{ metallb_manifest_file }}
      when: not ansible_check_mode
      register: _metallb_manifest_apply
      changed_when: >-
        ('created' in _metallb_manifest_apply.stdout)
        or ('configured' in _metallb_manifest_apply.stdout)

    - name: Wait for MetalLB controller deployment rollout
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          -n {{ metallb_namespace }} rollout status deployment/controller --timeout=180s
      when: not ansible_check_mode
      changed_when: false

    - name: Wait for MetalLB webhook service EndpointSlice to be ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          -n {{ metallb_namespace }} get endpointslices
          -l kubernetes.io/service-name=metallb-webhook-service
          -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}'
      register: _metallb_webhook_ep
      retries: 24
      delay: 5
      until: (_metallb_webhook_ep.stdout | trim | length) > 0
      when: not ansible_check_mode
      changed_when: false

    - name: Apply MetalLB IPAddressPool and L2Advertisement
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ metallb_kubeconfig }}
          apply -f {{ metallb_config_file }}
      when: not ansible_check_mode
      register: _metallb_pool_apply
      changed_when: >-
        ('created' in _metallb_pool_apply.stdout)
        or ('configured' in _metallb_pool_apply.stdout)

    - name: Report MetalLB setup summary
      ansible.builtin.debug:
        msg: >-
          MetalLB {{ metallb_version }} is active in namespace '{{ metallb_namespace }}'
          with L2 pool '{{ metallb_pool_name }}' ({{ _metallb_resolved_pool }})
          {{ 'bound to ' ~ _metallb_target_interface if (_metallb_use_libvirt_nic | bool) else '(all interfaces)' }}.
      when: (_metallb_manifest_apply is changed) or (_metallb_pool_apply is changed)
