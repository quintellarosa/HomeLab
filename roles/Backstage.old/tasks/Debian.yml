---
- name: Install Backstage Debian dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - build-essential
      - python3
      - python3-venv
      - python3-psycopg2
      - ufw
    state: present
    update_cache: true

- name: Allow Backstage frontend and backend ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ backstage.frontend.port }}"
    - "{{ backstage.backend.port }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
