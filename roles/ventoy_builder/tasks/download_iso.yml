---
- name: Download official SHA256SUMS file
  ansible.builtin.get_url:
    url: "{{ active_distro.sha256sums_url }}"
    dest: "{{ iso_cache_dir }}/{{ target_distro }}.SHA256SUMS"
    mode: "0644"
    force: true

- name: Extract expected SHA-256 checksum for {{ active_distro.iso_filename }}
  ansible.builtin.shell: |
    set -euo pipefail
    awk -v f="{{ active_distro.iso_filename }}" '$2 == "*"f || $2 == f { print $1; exit }' "{{ iso_cache_dir }}/{{ target_distro }}.SHA256SUMS"
  args:
    executable: /bin/bash
  register: iso_expected_sha256
  changed_when: false

- name: Verify checksum string was found
  ansible.builtin.assert:
    that:
      - iso_expected_sha256.stdout | trim | length == 64
    fail_msg: "Could not find SHA-256 checksum for {{ active_distro.iso_filename }} in {{ active_distro.sha256sums_url }}"

- name: Download and verify {{ active_distro.iso_filename }}
  ansible.builtin.get_url:
    url: "{{ active_distro.iso_url }}"
    dest: "{{ iso_cache_dir }}/{{ active_distro.iso_filename }}"
    checksum: "sha256:{{ iso_expected_sha256.stdout | trim }}"
    mode: "0644"
