---
- name: Remove older or conflicting Docker packages
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent

- name: Add official Docker repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: >-
      https://download.docker.com/linux/{{
        'fedora' if ansible_facts['distribution'] == 'Fedora'
        else 'centos' if ansible_facts['distribution'] in ['CentOS', 'Rocky', 'AlmaLinux']
        else 'rhel'
      }}/$releasever/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: >-
      https://download.docker.com/linux/{{
        'fedora' if ansible_facts['distribution'] == 'Fedora'
        else 'centos' if ansible_facts['distribution'] in ['CentOS', 'Rocky', 'AlmaLinux']
        else 'rhel'
      }}/gpg
