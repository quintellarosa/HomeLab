---
- name: Validate Google Chrome platform support
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat", "Suse"]
      - ansible_facts['architecture'] == "x86_64"
    fail_msg: >-
      Google Chrome installation supports Debian, RedHat and SUSE systems with x86_64 architecture.

- name: Configure Google Chrome repository for RedHat-family systems
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Configure Google Chrome repository for Debian-family systems
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Configure Google Chrome repository for SUSE-family systems
  ansible.builtin.include_tasks: SUSE.yml
  when: ansible_facts['os_family'] == "Suse"

- name: Install Google Chrome
  ansible.builtin.package:
    name: google-chrome-stable
    state: present
    update_cache: true