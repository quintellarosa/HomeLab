---
- name: Update GRUB on Debian/Ubuntu
  ansible.builtin.command:
    cmd: update-grub

- name: Update GRUB on SUSE
  ansible.builtin.command:
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg

- name: Reboot required notice
  ansible.builtin.debug:
    msg: "System updates and IOMMU kernel parameters were applied. Please reboot your machine for changes to take effect."

