---
- name: Check if user avatar file exists
  ansible.builtin.stat:
    path: "{{ user_avatar_file_path }}"
  delegate_to: localhost
  become: false
  register: _user_avatar_stat
  when: user_avatar_file_path | default('') | length > 0

- name: Install user avatar to ~/.face and AccountsService
  when:
    - user_avatar_file_path | default('') | length > 0
    - _user_avatar_stat.stat.exists | default(false)
  block:
    - name: Copy user avatar to ~/.face
      ansible.builtin.copy:
        src: "{{ user_avatar_file_path }}"
        dest: "/home/{{ user_avatar_user }}/.face"
        owner: "{{ user_avatar_user }}"
        group: "{{ user_avatar_user }}"
        mode: "0644"

    - name: Ensure AccountsService directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
      loop:
        - /var/lib/AccountsService/icons
        - /var/lib/AccountsService/users

    - name: Copy user avatar to AccountsService icons
      ansible.builtin.copy:
        src: "{{ user_avatar_file_path }}"
        dest: "/var/lib/AccountsService/icons/{{ user_avatar_user }}"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure AccountsService [User] section exists
      ansible.builtin.lineinfile:
        path: "/var/lib/AccountsService/users/{{ user_avatar_user }}"
        regexp: '^\[User\]$'
        line: "[User]"
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: Configure AccountsService user icon path
      ansible.builtin.lineinfile:
        path: "/var/lib/AccountsService/users/{{ user_avatar_user }}"
        regexp: "^Icon="
        line: "Icon=/var/lib/AccountsService/icons/{{ user_avatar_user }}"
        insertafter: '^\[User\]'
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux contexts on AccountsService avatar files (RedHat)
      ansible.builtin.command:
        cmd: >-
          restorecon -RF
          /var/lib/AccountsService/icons/{{ user_avatar_user }}
          /var/lib/AccountsService/users/{{ user_avatar_user }}
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
      changed_when: false
