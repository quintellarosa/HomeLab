---
- name: Build Ventoy auto-install stage and ISO cache
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Check for group_vars/secrets.yml
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../group_vars/secrets.yml"
      register: homelab_secrets_file

    - name: Load group_vars/secrets.yml if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      when: homelab_secrets_file.stat.exists

    - name: Display active target configuration
      ansible.builtin.debug:
        msg:
          - "Distro: {{ active_distro.name }} ({{ target_distro }})"
          - "Disk profile: {{ disk_profile }} -> OS serial={{ active_disk_profile.os_disk_serial }}"
          - "Preserved /home: uuid='{{ active_disk_profile.home_fs_uuid }}' label='{{ active_disk_profile.home_fs_label }}' ({{ active_disk_profile.home_fs_type }})"
          - "Protected serials: {{ active_disk_profile.protected_disk_serials | join(', ') }}"

  roles:
    - role: ventoy_builder
